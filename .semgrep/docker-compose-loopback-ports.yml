rules:
  - id: docker-compose-port-no-loopback
    patterns:
      - pattern-either:
          # Short syntax with explicit host:container[/proto] mapping.
          # Matches IPv4 hosts and bracketed IPv6 ([::], [::1], etc.).
          # Excludes loopback via negative lookahead.
          - pattern-regex: '^\s+-\s+["'']?(?!127\.0\.0\.1:|\[::1\]:|::1:)[a-zA-Z0-9\.\[\]\:\-]+:\d+'
          # Hostless short syntax (no host prefix — binds to 0.0.0.0); handles
          # single ports (3000), ranges (9090-9091), and optional protocols
          - pattern-regex: '^\s+-\s+["'']?\d+(?:-\d+)?(?:/\w+)?["'']?\s*(?:#.*)?$'
    message: >
      Port published without loopback (127.0.0.1) binding. In dev Compose
      files, every published port must be bound to 127.0.0.1 unless the
      service is a public entry point (e.g. the gateway on 80/8080). Unbound
      ports expose internal services directly to the network, bypassing the
      gateway's CSP, rate limiting, and security headers.
      Use short syntax `"127.0.0.1:<port>:<port>"` or long syntax with
      `host_ip: 127.0.0.1`. Suppress false positives with
      `# nosemgrep: docker-compose-port-no-loopback`.
      See https://github.com/F4CTE/PolyForge/issues/1310
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "docker-compose.infra.yml"
    metadata:
      cwe:
        - "CWE-668: Exposure of Resource to Wrong Sphere"
      references:
        - https://github.com/F4CTE/PolyForge/issues/1310
        - https://github.com/F4CTE/PolyForge/issues/557
      category: security
      technology:
        - docker

  - id: docker-compose-port-no-loopback-long-syntax
    patterns:
      - pattern-either:
          # target before published (most common ordering); leading `...`
          # after `-` matches any preceding keys like `name:`, `protocol:`
          - pattern: |
              ...
              - ...
                target: $TARG
                ...
                published: $PUB
                ...
          # published before target (valid YAML, less common ordering)
          - pattern: |
              ...
              - ...
                published: $PUB
                ...
                target: $TARG
                ...
    message: >
      Docker Compose long-syntax port mapping detected. All long-syntax
      `target`/`published` mappings must include `host_ip: 127.0.0.1` for
      loopback binding. Note: this rule fires on ALL long-syntax port
      mappings regardless of `host_ip`; suppress safe bindings with
      `# nosemgrep: docker-compose-port-no-loopback-long-syntax`.
      The CI shell check accepts `docker-compose-port-no-loopback`,
      `docker-compose-port-no-loopback-long-syntax`, and
      `docker-compose-port-no-loopback-flow-style`.
      See https://github.com/F4CTE/PolyForge/issues/1310
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "docker-compose.infra.yml"
    metadata:
      cwe:
        - "CWE-668: Exposure of Resource to Wrong Sphere"
      references:
        - https://github.com/F4CTE/PolyForge/issues/1310
        - https://github.com/F4CTE/PolyForge/issues/557
      category: security
      technology:
        - docker

  - id: docker-compose-port-no-loopback-flow-style
    patterns:
      - pattern-regex: '^\s+ports:\s*\['
    message: >
      Docker Compose flow-style port sequence detected.  Flow-style
      (e.g. `ports: ["3000:3000"]` or `ports: [3000]`) bypasses the
      block-style loopback guard in the CI shell checker because the
      shell checker operates on indented `- ` entries.  Rewrite as
      block-style with an explicit loopback binding:
      `- "127.0.0.1:<port>:<port>"`.  Suppress safe flow-style bindings
      with `# nosemgrep: docker-compose-port-no-loopback-flow-style`.
      The CI shell check also accepts
      `docker-compose-port-no-loopback-flow-style` for suppression.
      See https://github.com/F4CTE/PolyForge/issues/1310
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "docker-compose.infra.yml"
    metadata:
      cwe:
        - "CWE-668: Exposure of Resource to Wrong Sphere"
      references:
        - https://github.com/F4CTE/PolyForge/issues/1310
        - https://github.com/F4CTE/PolyForge/issues/557
      category: security
      technology:
        - docker
