name: polyforge-dev

# ─────────────────────────────────────────────────────────────────────────────
# INFRASTRUCTURE ONLY
# Use this file until NestJS services are implemented.
# Once services exist, switch to docker-compose.dev.yml
#
# Usage:
#   cp .env.dev .env          # first time only — sets dev credentials
#   docker compose -f docker-compose.infra.yml up -d
#
# Migrations run automatically via multi-stage containers (migrate-user,
# migrate-admin). They build, generate the Prisma client, then apply
# all pending migrations before exiting.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  public:
  # `internal` is intentionally a regular bridge in dev so backend services
  # (market-data, notification, bot, order, strategy-engine, api, etc.)
  # retain outbound internet access for Polymarket CLOB, Stripe, SES, and
  # other external dependencies during local development. Production hardens
  # this network with `internal: true` once outbound traffic is mediated by
  # AWS VPC egress controls.
  internal:
  # `signer-only` carries credential-handling traffic between
  # signer-service / order-service / redis and MUST NOT have outbound
  # internet, even in dev. Members of this network that legitimately need
  # outbound (e.g. order-service for CLOB submissions) are already attached
  # to `internal` as well, so they egress through there.
  signer-only:
    driver: bridge
    internal: true
  # `admin-only` similarly should never reach the public internet; admin
  # services pair it with `internal` when egress is required.
  admin-only:
    driver: bridge
    internal: true
  # Docker does not make host-published ports reachable for containers attached
  # only to an internal network on the lab runner. Attach postgres-admin to this
  # otherwise-empty bridge so its 127.0.0.1:5434 publish is active while keeping
  # admin service traffic isolated on admin-only.
  admin-host-publish:
    driver: bridge
  posthog:

volumes:
  postgres-data:
  postgres-admin-data:
  redis-data:
  posthog-db-data:
  posthog-clickhouse-data:
  posthog-kafka-data:

services:

  # ─── USER DATABASE ─────────────────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=200
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c wal_buffers=16MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required – see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-polyforge}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poly -d polyforge"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3  # pinned — keep aligned with docker-compose.prod.yml
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-poly}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-polyforge}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 40
      MAX_DB_CONNECTIONS: 50
      SERVER_RESET_QUERY: DISCARD ALL
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  # ─── USER DB MIGRATION ─────────────────────────────────────────────────────
  # Multi-stage: builds Prisma client then runs migrate deploy inside Docker.
  # Runs once and exits. NestJS services depend on this being complete.

  migrate-user:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # ─── ADMIN DATABASE ────────────────────────────────────────────────────────

  postgres-admin:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-poly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-polyforge_admin}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-admin-data:/var/lib/postgresql/data
    networks: [admin-only, admin-host-publish]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poly_admin -d polyforge_admin"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgbouncer-admin:
    image: edoburu/pgbouncer:v1.23.1-p3  # pinned — keep aligned with docker-compose.prod.yml
    environment:
      DATABASE_URL: postgres://${POSTGRES_ADMIN_USER:-poly_admin}:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres-admin:5432/${POSTGRES_ADMIN_DB:-polyforge_admin}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 20
      DEFAULT_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 0
      SERVER_RESET_QUERY: DISCARD ALL
    depends_on:
      postgres-admin: { condition: service_healthy }
    networks: [admin-only]

  # ─── ADMIN DB MIGRATION ────────────────────────────────────────────────────

  migrate-admin:
    build:
      context: .
      dockerfile: Dockerfile.migrate.admin
    environment:
      ADMIN_DIRECT_DATABASE_URL: postgresql://poly_admin:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres-admin:5432/polyforge_admin
    networks: [admin-only]
    depends_on:
      postgres-admin: { condition: service_healthy }
    restart: "no"

  # ─── REDIS ─────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --hz 10
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks: [internal, signer-only]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── MAILHOG ───────────────────────────────────────────────────────────────

  mailhog:
    image: axllent/mailpit:v1.23
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks: [internal]


  # ─── SIGNER SERVICE ──────────────────────────────────────────────────────
  # NO published ports — only reachable on the signer-only network.

  signer-service:
    build:
      context: .
      dockerfile: services/signer-service/Dockerfile
    environment:
      # SECURITY: Signer uses direct DB connection (not pgbouncer) for credential operations
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENCRYPTION_KEY: "${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY is required}"
      MASTER_ENCRYPTION_KEY: "${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY is required}"
      POLY_BUILDER_API_KEY: ${POLY_BUILDER_API_KEY:?POLY_BUILDER_API_KEY is required}
      POLY_BUILDER_SECRET: ${POLY_BUILDER_SECRET:?POLY_BUILDER_SECRET is required}
      POLY_BUILDER_PASSPHRASE: ${POLY_BUILDER_PASSPHRASE:?POLY_BUILDER_PASSPHRASE is required}
      POLYMARKET_BUILDER_CODE: ${POLYMARKET_BUILDER_CODE:-}
      CHAIN_ID: ${CHAIN_ID:-137}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:?POLYGON_RPC_URL is required}
      GAS_SPONSOR_PRIVATE_KEY: ${GAS_SPONSOR_PRIVATE_KEY:-}
      GAS_SPONSOR_ENABLED: ${GAS_SPONSOR_ENABLED:-false}
      GAS_DAILY_LIMIT_MATIC: ${GAS_DAILY_LIMIT_MATIC:-0.5}
      GAS_ESTIMATE_MATIC: ${GAS_ESTIMATE_MATIC:-0.002}
      PORT: "3012"
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
    networks: [internal, signer-only]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ─── STRATEGY ENGINE ─────────────────────────────────────────────────────

  strategy-engine:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: "3006"
    ports:
      - "127.0.0.1:3006:3006"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # ─── ORDER SERVICE ───────────────────────────────────────────────────────

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SIGNER_SERVICE_URL: http://signer-service:3012
      CLOB_API_URL: ${CLOB_API_URL:-https://clob.polymarket.com}
      POLYMARKET_US_ENABLED: ${POLYMARKET_US_ENABLED:-false}
      POLYMARKET_US_API_URL: ${POLYMARKET_US_API_URL:-https://api.polymarket.us}
      POLYMARKET_US_WS_URL: ${POLYMARKET_US_WS_URL:-wss://ws.polymarket.us}
      PORT: "3007"
    ports:
      - "127.0.0.1:3007:3007"
    networks: [internal, signer-only]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      signer-service: { condition: service_started }
    restart: unless-stopped

  # ─── API SERVICE ─────────────────────────────────────────────────────────

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      JWT_SECRET: "${USER_JWT_SECRET:?USER_JWT_SECRET is required}"
      USER_JWT_SECRET: "${USER_JWT_SECRET:?USER_JWT_SECRET is required}"
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      INTERNAL_JWT_AUDIENCE: "${API_SERVICE_INTERNAL_JWT_AUDIENCE:?API_SERVICE_INTERNAL_JWT_AUDIENCE is required}"
      INTERNAL_JWT_ISSUERS: "${API_SERVICE_INTERNAL_JWT_ISSUERS:?API_SERVICE_INTERNAL_JWT_ISSUERS is required}"
      STRATEGY_ENGINE_URL: http://strategy-engine:3006
      CLOB_API_URL: ${CLOB_API_URL:-https://clob.polymarket.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEWS_RSS_FEEDS: ${NEWS_RSS_FEEDS:-}
      GEO_BLOCKED_COUNTRIES: ${GEO_BLOCKED_COUNTRIES:-US,AU,BE,BY,BI,CF,CG,CU,DE,ET,FR,GB,IR,IQ,IT,KP,LB,LY,MM,NI,NL,RU,SO,SS,SD,SY,VE,YE,ZW,UM}
      GEO_CLOSE_ONLY_COUNTRIES: ${GEO_CLOSE_ONLY_COUNTRIES:-PL,SG,TH,TW}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://polyforge-lab,http://polyforge-lab:8080,https://polyforge-lab,https://polyforge-lab:8443,https://localhost}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: "3002"
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
      CI: "${CI:-false}"
      NODE_OPTIONS: "--max-old-space-size=1024"
      PRISMA_POOL_SIZE: "20"
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-http://posthog:8000}
    ports:
      - "127.0.0.1:3002:3002"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-user: { condition: service_completed_successfully }
    restart: unless-stopped

  # ─── PAPER ORDER SERVICE ─────────────────────────────────────────────────

  paper-order-service:
    profiles: [full]
    build:
      context: .
      dockerfile: services/paper-order-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      PORT: "3008"
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
    ports:
      - "127.0.0.1:3008:3008"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-user: { condition: service_completed_successfully }
    restart: unless-stopped

  # ─── BACKTEST SERVICE ────────────────────────────────────────────────────

  backtest-service:
    build:
      context: .
      dockerfile: services/backtest-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      PORT: "3009"
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
    ports:
      - "127.0.0.1:3009:3009"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-user: { condition: service_completed_successfully }
    restart: unless-stopped

  # ─── NOTIFICATION SERVICE ────────────────────────────────────────────────

  notification-service:
    profiles: [full]
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      EMAIL_DRIVER: ${EMAIL_DRIVER:-mailhog}
      MAILHOG_HOST: ${MAILHOG_HOST:-mailhog}
      MAILHOG_PORT: ${MAILHOG_PORT:-1025}
      AWS_SES_REGION: ${AWS_SES_REGION:-us-east-1}
      AWS_SES_FROM_EMAIL: noreply@polyforge.app
      AWS_SES_SMTP_USER: ${AWS_SES_SMTP_USER:-}
      AWS_SES_SMTP_PASSWORD: ${AWS_SES_SMTP_PASSWORD:-}
      # NOTE: Production should use Docker secrets or an external secret manager
      # (e.g. Vault, AWS Secrets Manager) instead of plain environment variables
      # for bot tokens and other sensitive credentials.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-dev-disabled}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-dev-disabled}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PORT: "3010"
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
    ports:
      - "127.0.0.1:3010:3010"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-user: { condition: service_completed_successfully }
      mailhog: { condition: service_started }
    restart: unless-stopped

  # ─── BOT SERVICE ─────────────────────────────────────────────────────────

  bot-service:
    profiles: [full]
    build:
      context: .
      dockerfile: services/bot-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      STRATEGY_ENGINE_URL: http://strategy-engine:3006
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      BOT_JWT_SECRET: "${BOT_JWT_SECRET:?BOT_JWT_SECRET is required}"
      # NOTE: Production should use Docker secrets or an external secret manager
      # for bot tokens instead of plain environment variables.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-dev-disabled}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-dev-disabled}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-dev-disabled}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      API_SERVICE_URL: http://api-service:3002
      PORT: "3011"
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
    ports:
      - "127.0.0.1:3011:3011"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-user: { condition: service_completed_successfully }
    restart: unless-stopped

  # ─── ADMIN API SERVICE ───────────────────────────────────────────────────

  admin-api-service:
    build:
      context: .
      dockerfile: services/admin-api-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      ADMIN_DATABASE_URL: postgresql://poly_admin:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@pgbouncer-admin:5432/polyforge_admin?connect_timeout=10
      ADMIN_DIRECT_DATABASE_URL: postgresql://poly_admin:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres-admin:5432/polyforge_admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}"
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      STRATEGY_ENGINE_URL: http://strategy-engine:3006
      BUILDER_TIER: ${BUILDER_TIER:-UNVERIFIED}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-mailhog}
      MAILHOG_HOST: ${MAILHOG_HOST:-mailhog}
      MAILHOG_PORT: ${MAILHOG_PORT:-1025}
      AWS_SES_REGION: ${AWS_SES_REGION:-us-east-1}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-noreply@polyforge.app}
      AWS_SES_SMTP_USER: ${AWS_SES_SMTP_USER:-}
      AWS_SES_SMTP_PASSWORD: ${AWS_SES_SMTP_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-https://localhost:8443,https://polyforge-lab:8443}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: "3004"
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
    ports:
      - "127.0.0.1:3004:3004"
    networks: [internal, admin-only]
    depends_on:
      postgres: { condition: service_healthy }
      postgres-admin: { condition: service_healthy }
      pgbouncer-admin: { condition: service_started }
      redis: { condition: service_healthy }
      mailhog: { condition: service_started }
      migrate-user: { condition: service_completed_successfully }
      migrate-admin: { condition: service_completed_successfully }
    restart: unless-stopped

  # ─── MARKET DATA SERVICE ─────────────────────────────────────────────────

  # ─── AUTH SERVICE ────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      USER_JWT_SECRET: "${USER_JWT_SECRET:?USER_JWT_SECRET is required}"
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      INTERNAL_JWT_AUDIENCE: "${AUTH_SERVICE_INTERNAL_JWT_AUDIENCE:?AUTH_SERVICE_INTERNAL_JWT_AUDIENCE is required}"
      INTERNAL_JWT_ISSUERS: "${AUTH_SERVICE_INTERNAL_JWT_ISSUERS:?AUTH_SERVICE_INTERNAL_JWT_ISSUERS is required}"
      MASTER_ENCRYPTION_KEY: "${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY is required}"
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}"
      EMAIL_DRIVER: ${EMAIL_DRIVER:-mailhog}
      MAILHOG_HOST: ${MAILHOG_HOST:-mailhog}
      MAILHOG_PORT: ${MAILHOG_PORT:-1025}
      AWS_SES_REGION: ${AWS_SES_REGION:-us-east-1}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-noreply@polyforge.app}
      AWS_SES_SMTP_USER: ${AWS_SES_SMTP_USER:-}
      AWS_SES_SMTP_PASSWORD: ${AWS_SES_SMTP_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      INVITE_ONLY: ${INVITE_ONLY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://polyforge-lab,http://polyforge-lab:8080,https://polyforge-lab,https://polyforge-lab:8443,https://localhost}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AUTH_SERVICE_PORT: "3001"
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
      CI: "${CI:-false}"
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-http://posthog:8000}
    ports:
      - "127.0.0.1:3001:3001"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailhog: { condition: service_started }
      migrate-user: { condition: service_completed_successfully }
    restart: unless-stopped

  # ─── ADMIN AUTH SERVICE ───────────────────────────────────────────────────

  admin-auth-service:
    build:
      context: .
      dockerfile: services/admin-auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      ADMIN_DATABASE_URL: postgresql://poly_admin:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@pgbouncer-admin:5432/polyforge_admin?connect_timeout=10
      ADMIN_DIRECT_DATABASE_URL: postgresql://poly_admin:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres-admin:5432/polyforge_admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}"
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://polyforge-lab,http://polyforge-lab:8080,https://polyforge-lab,https://polyforge-lab:8443,https://localhost}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_AUTH_SERVICE_PORT: "3003"
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
      CI: "${CI:-false}"
    ports:
      - "127.0.0.1:3003:3003"
    networks: [internal, admin-only]
    depends_on:
      postgres: { condition: service_healthy }
      postgres-admin: { condition: service_healthy }
      pgbouncer-admin: { condition: service_started }
      redis: { condition: service_healthy }
      migrate-user: { condition: service_completed_successfully }
      migrate-admin: { condition: service_completed_successfully }
    restart: unless-stopped

  # ─── FRONTEND APPS ───────────────────────────────────────────────────────

  user-app:
    build:
      context: .
      dockerfile: apps/user-app/Dockerfile
    networks: [internal]
    restart: unless-stopped

  admin-app:
    build:
      context: .
      dockerfile: apps/admin-app/Dockerfile
    networks: [internal, admin-only]
    restart: unless-stopped

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]
    restart: unless-stopped

  # ─── GATEWAY ─────────────────────────────────────────────────────────────
  # Port 80  → user app (landing + SPA + api-service + auth-service)
  # Port 8080 → admin app (SPA + admin-api-service + admin-auth-service)

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./services/gateway/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "8080:8080"
    networks: [internal, admin-only]
    depends_on:
      - user-app
      - admin-app
      - landing
      - api-service
      - auth-service
      - admin-api-service
      - admin-auth-service
    restart: unless-stopped

  # ─── MARKET DATA SERVICE ─────────────────────────────────────────────────

  market-data-service:
    profiles: [full]
    build:
      context: .
      dockerfile: services/market-data-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      DIRECT_DATABASE_URL: postgresql://poly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/polyforge
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}"
      INTERNAL_JWT_AUDIENCE: "${MARKET_DATA_SERVICE_INTERNAL_JWT_AUDIENCE:?MARKET_DATA_SERVICE_INTERNAL_JWT_AUDIENCE is required}"
      INTERNAL_JWT_ISSUERS: "${MARKET_DATA_SERVICE_INTERNAL_JWT_ISSUERS:?MARKET_DATA_SERVICE_INTERNAL_JWT_ISSUERS is required}"
      CLOB_API_URL: ${CLOB_API_URL:-https://clob.polymarket.com}
      CLOB_WS_URL: wss://ws-subscriptions-clob.polymarket.com/ws/market
      GAMMA_API_URL: https://gamma-api.polymarket.com
      PORT: "3005"
    ports:
      - "127.0.0.1:3005:3005"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # ─── POSTHOG CE — PRODUCT ANALYTICS ──────────────────────────────────────
  # Self-hosted PostHog Community Edition for event tracking, session replay,
  # funnels, and feature flags. All data stays on polyforge-lab.
  #
  # First-time setup:
  #   1. docker compose -f docker-compose.infra.yml up -d posthog
  #   2. Visit http://polyforge-lab:8000 and create the first user
  #   3. Copy the project API key into .env as POSTHOG_API_KEY
  #   4. Restart backend services to activate event capture

  posthog-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: ${POSTHOG_DB_PASSWORD:-posthog}
      POSTGRES_DB: posthog
    volumes:
      - posthog-db-data:/var/lib/postgresql/data
    networks: [posthog]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog -d posthog"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  posthog-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks: [posthog]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  posthog-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - posthog-clickhouse-data:/var/lib/clickhouse
    networks: [posthog]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  posthog-kafka:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=256M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://posthog-kafka:9092
      - --check=false
    volumes:
      - posthog-kafka-data:/var/lib/redpanda/data
    networks: [posthog]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  posthog:
    image: posthog/posthog:latest
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD:-posthog}@posthog-db:5432/posthog
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_HTTP_URL: http://posthog-clickhouse:8123
      REDIS_URL: redis://posthog-redis:6379
      KAFKA_HOSTS: posthog-kafka:9092
      # Fail loudly on missing secret rather than booting with a known
      # placeholder ("<GENERATE_ME>") that would silently weaken every
      # PostHog session token in dev.
      SECRET_KEY: ${POSTHOG_SECRET_KEY:?POSTHOG_SECRET_KEY must be set in .env (use `openssl rand -hex 32`)}
      SITE_URL: http://polyforge-lab:8000
      IS_BEHIND_PROXY: "false"
      DISABLE_SECURE_SSL_REDIRECT: "true"
      JS_URL: http://polyforge-lab:8000
    ports:
      - "127.0.0.1:8000:8000"
    networks: [posthog, internal]
    depends_on:
      posthog-db: { condition: service_healthy }
      posthog-redis: { condition: service_healthy }
      posthog-clickhouse: { condition: service_healthy }
      posthog-kafka: { condition: service_healthy }
    restart: unless-stopped

  posthog-worker:
    image: posthog/posthog:latest
    command: ./bin/docker-worker-celery --with-scheduler
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD:-posthog}@posthog-db:5432/posthog
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_HTTP_URL: http://posthog-clickhouse:8123
      REDIS_URL: redis://posthog-redis:6379
      KAFKA_HOSTS: posthog-kafka:9092
      # Fail loudly on missing secret rather than booting with a known
      # placeholder ("<GENERATE_ME>") that would silently weaken every
      # PostHog session token in dev.
      SECRET_KEY: ${POSTHOG_SECRET_KEY:?POSTHOG_SECRET_KEY must be set in .env (use `openssl rand -hex 32`)}
      SITE_URL: http://polyforge-lab:8000
    networks: [posthog]
    depends_on:
      posthog-db: { condition: service_healthy }
      posthog-redis: { condition: service_healthy }
      posthog-clickhouse: { condition: service_healthy }
      posthog-kafka: { condition: service_healthy }
    restart: unless-stopped
