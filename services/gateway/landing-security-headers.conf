# Landing page security headers — included by each landing HTML location
# block because nginx add_header at location level does not inherit from
# the server level when the location defines its own add_header directives.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options           "DENY"                           always;
add_header X-Content-Type-Options    "nosniff"                        always;
add_header X-XSS-Protection          "1; mode=block"                  always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://plausible.io https://*.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://plausible.io wss://polyforge.app https://*.i.posthog.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
