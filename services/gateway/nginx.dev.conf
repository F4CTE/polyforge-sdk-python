# DEV: Used by docker-compose.infra.yml for local development
# ─── Polyforge Dev Nginx Configuration ────────────────────────────────────────
#
# HTTP only — no TLS for local development.
#
# Port 80  → user app (landing at /, SPA, api-service, auth-service, WebSocket)
# Port 8080 → admin app (SPA, admin-api-service, admin-auth-service)
#
# DNS re-resolution: uses Docker's internal resolver (127.0.0.11) so nginx
# automatically picks up new IPs after container rebuilds — no manual reload.
#
# Access:
#   http://localhost         user app
#   http://localhost:8080    admin app
# ──────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile       on;
    keepalive_timeout  65;
    server_tokens  off;

    # ── Docker DNS resolver — re-resolves hostnames every 10s ─────────────────
    # This ensures nginx picks up new container IPs after rebuilds automatically.

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Micro-cache for public read endpoints (sub-1ms p95 target) ──────────
    # Short TTL (5s) ensures data freshness while absorbing burst traffic.
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60s;

    # ── Gzip ───────────────────────────────────────────────────────────────────

    # ── Security headers ───────────────────────────────────────────────────────
    # Applied globally to all responses — including React/Next.js static files.
    # HSTS is intentionally omitted here (HTTP-only dev env); add it in the
    # production TLS nginx config: Strict-Transport-Security: max-age=31536000; includeSubDomains; preload

    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # DEV CSP — permissive for local development.
    # Production uses stricter CSP with nonces (see nginx.prod.conf).
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' ws: wss: http://localhost:*; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/json application/javascript
                      application/xml+rss application/atom+xml
                      image/svg+xml application/wasm;

    # ── Proxy buffers ──────────────────────────────────────────────────────
    proxy_buffer_size        16k;
    proxy_buffers            8 32k;
    proxy_busy_buffers_size  64k;

    # ── WebSocket upgrade map ──────────────────────────────────────────────────

    # Only allow WebSocket upgrades — prevents H2C smuggling (closes #298, #385)
    map $http_upgrade $safe_upgrade {
        default "";
        websocket websocket;
    }
    map $http_upgrade $safe_connection {
        default "";
        websocket upgrade;
    }

    # ── User app (port 80) ─────────────────────────────────────────────────────

    server {
        listen  80;
        listen  [::]:80;
        server_name  _;

        # ── WebSocket (api-service) ─────────────────────────────────────────

        location /ws {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $safe_upgrade;
            proxy_set_header    Connection         $safe_connection;
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── Micro-cached public read endpoints ────────────────────────────────
        # 5s cache for high-traffic GET endpoints — serves stale on upstream errors.

        location /api/v1/markets {
            set $upstream http://api-service:3002;
            proxy_cache            api_cache;
            proxy_cache_valid      200 5s;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
            proxy_cache_methods    GET HEAD;
            proxy_cache_key        "$scheme$request_method$server_name$request_uri";
            proxy_no_cache         $http_cookie;
            proxy_cache_bypass     $http_cookie;
            add_header             X-Cache-Status $upstream_cache_status;
            proxy_pass             $upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade            "";
            proxy_set_header       Connection         "";
            proxy_set_header       Host               localhost;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
            client_max_body_size   1m;
        }

        location /api/v1/discover {
            set $upstream http://api-service:3002;
            proxy_cache            api_cache;
            proxy_cache_valid      200 5s;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
            proxy_cache_methods    GET HEAD;
            proxy_cache_key        "$scheme$request_method$server_name$request_uri";
            add_header             X-Cache-Status $upstream_cache_status;
            proxy_pass             $upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade            "";
            proxy_set_header       Connection         "";
            proxy_set_header       Host               localhost;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
            client_max_body_size   1m;
        }

        location /api/v1/leaderboard {
            set $upstream http://api-service:3002;
            proxy_cache            api_cache;
            proxy_cache_valid      200 5s;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
            proxy_cache_methods    GET HEAD;
            proxy_cache_key        "$scheme$request_method$server_name$request_uri";
            add_header             X-Cache-Status $upstream_cache_status;
            proxy_pass             $upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade            "";
            proxy_set_header       Connection         "";
            proxy_set_header       Host               localhost;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
            client_max_body_size   1m;
        }

        location /api/v1/news {
            set $upstream http://api-service:3002;
            proxy_cache            api_cache;
            proxy_cache_valid      200 5s;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
            proxy_cache_methods    GET HEAD;
            proxy_cache_key        "$scheme$request_method$server_name$request_uri";
            add_header             X-Cache-Status $upstream_cache_status;
            proxy_pass             $upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade            "";
            proxy_set_header       Connection         "";
            proxy_set_header       Host               localhost;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
            client_max_body_size   1m;
        }

        # ── REST API (api-service) — all other endpoints ─────────────────────

        location /api/v1/ {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Bot webhook endpoints (WhatsApp, Telegram, Discord) ────────────
        # Accessible without auth at the gateway level — services verify signatures.

        location /api/v1/webhooks/ {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Auth (auth-service) ─────────────────────────────────────────────

        location /auth/v1/ {
            set $upstream http://auth-service:3001;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 512k;
        }

        # ── Landing page (Next.js) ───────────────────────────────────────────
        # Root and public sub-pages served by the Next.js landing app.
        # The SPA catch-all below handles everything else.

        location = / {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location /terms {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location /privacy {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location /pricing {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        # Landing static assets at their canonical paths
        location ~* ^/(styles\.css|robots\.txt|sitemap\.xml|og-image\.(png|svg)|favicon\.svg|favicon\.ico)$ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        # Next.js landing static assets (_next)
        location /_next/ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        # ── React user SPA (all other paths) ──────────────────────────────

        location / {
            set $upstream http://user-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }
    }

    # ── Admin app (port 8080) ──────────────────────────────────────────────────

    server {
        listen  8080;
        listen  [::]:8080;
        server_name  _;

        # ── Admin WebSocket ─────────────────────────────────────────────────

        location /ws {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $safe_upgrade;
            proxy_set_header    Connection         $safe_connection;
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
        }

        # ── Admin REST API ──────────────────────────────────────────────────

        location /api/v1/ {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Admin Auth ──────────────────────────────────────────────────────

        location /auth/v1/ {
            set $upstream http://admin-auth-service:3003;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 512k;
        }

        # ── React admin SPA ────────────────────────────────────────────────

        location / {
            set $upstream http://admin-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }
    }
}
