# DEV: Used by docker-compose.infra.yml for local development
# ─── Polyforge Dev Nginx Configuration ────────────────────────────────────────
#
# HTTP only — no TLS for local development.
#
# Port 80  → user app (landing at /, SPA, api-service, auth-service, WebSocket)
# Port 8080 → admin app (SPA, admin-api-service, admin-auth-service)
#
# DNS re-resolution: uses Docker's internal resolver (127.0.0.11) so nginx
# automatically picks up new IPs after container rebuilds — no manual reload.
#
# Access:
#   http://localhost         user app
#   http://localhost:8080    admin app
# ──────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile       on;
    keepalive_timeout  65;
    server_tokens  off;

    # ── Docker DNS resolver — re-resolves hostnames every 10s ─────────────────
    # This ensures nginx picks up new container IPs after rebuilds automatically.

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Gzip ───────────────────────────────────────────────────────────────────

    # ── Security headers ───────────────────────────────────────────────────────
    # Applied globally to all responses — including React/Next.js static files.
    # HSTS is intentionally omitted here (HTTP-only dev env); add it in the
    # production TLS nginx config: Strict-Transport-Security: max-age=31536000; includeSubDomains; preload

    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # ── WebSocket upgrade map ──────────────────────────────────────────────────

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # ── User app (port 80) ─────────────────────────────────────────────────────

    server {
        listen  80;
        listen  [::]:80;
        server_name  _;

        # ── WebSocket (api-service) ─────────────────────────────────────────

        location /ws {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $http_upgrade;
            proxy_set_header    Connection         $connection_upgrade;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── REST API (api-service) ──────────────────────────────────────────

        location /api/v1/ {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Bot webhook endpoints (WhatsApp, Telegram, Discord) ────────────
        # Accessible without auth at the gateway level — services verify signatures.

        location /api/v1/webhooks/ {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Auth (auth-service) ─────────────────────────────────────────────

        location /auth/v1/ {
            set $upstream http://auth-service:3001;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 512k;
        }

        # ── Landing page — exact root only ──────────────────────────────────

        location = / {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
        }

        # Landing static assets at their canonical paths
        location ~* ^/(styles\.css|robots\.txt|sitemap\.xml|og-image\.(png|svg)|favicon\.svg|favicon\.ico)$ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
        }

        # Next.js landing static assets (_next)
        location /_next/ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
        }

        # ── React user SPA (all other paths) ──────────────────────────────

        location / {
            set $upstream http://user-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }
    }

    # ── Admin app (port 8080) ──────────────────────────────────────────────────

    server {
        listen  8080;
        listen  [::]:8080;
        server_name  _;

        # ── Admin WebSocket ─────────────────────────────────────────────────

        location /ws {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $http_upgrade;
            proxy_set_header    Connection         $connection_upgrade;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
        }

        # ── Admin REST API ──────────────────────────────────────────────────

        location /api/v1/ {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Admin Auth ──────────────────────────────────────────────────────

        location /auth/v1/ {
            set $upstream http://admin-auth-service:3003;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 512k;
        }

        # ── React admin SPA ────────────────────────────────────────────────

        location / {
            set $upstream http://admin-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }
    }
}
