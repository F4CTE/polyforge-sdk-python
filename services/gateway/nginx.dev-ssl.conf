# ─── Polyforge Dev Nginx Configuration (HTTPS) ────────────────────────────────
#
# Self-signed TLS for local development.
# Mirrors nginx.dev.conf but adds TLS on ports 443 and 8443.
# HTTP on 80/8080 redirects to HTTPS.
#
# Access:
#   https://localhost          user app
#   https://localhost:8443     admin app
#   http://localhost           → redirect to https://localhost
# ──────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile       on;
    keepalive_timeout  65;
    server_tokens  off;

    # ── Docker DNS resolver ──────────────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── TLS settings ─────────────────────────────────────────────────────────
    ssl_certificate      /etc/nginx/certs/dev.crt;
    ssl_certificate_key  /etc/nginx/certs/dev.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache    shared:SSL:2m;
    ssl_session_timeout  1h;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Only allow WebSocket upgrades — prevents H2C smuggling (closes #298, #385)
    map $http_upgrade $safe_upgrade {
        default "";
        websocket websocket;
    }
    map $http_upgrade $safe_connection {
        default "";
        websocket upgrade;
    }

    # ── HTTP → HTTPS redirect (user) ─────────────────────────────────────────
    server {
        listen  80;
        listen  [::]:80;
        server_name  _;
        return 301 https://$server_name$request_uri;
    }

    # ── HTTP → HTTPS redirect (admin) ────────────────────────────────────────
    server {
        listen  8080;
        listen  [::]:8080;
        server_name  _;
        return 301 https://$server_name:8443$request_uri;
    }

    # ── User app (port 443 — HTTPS) ──────────────────────────────────────────
    server {
        listen  443 ssl;
        listen  [::]:443 ssl;
        server_name  _;

        # ── WebSocket (api-service) ───────────────────────────────────────
        location /ws {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $safe_upgrade;
            proxy_set_header    Connection         $safe_connection;
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  https;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── REST API (api-service) ────────────────────────────────────────
        location /api/v1/ {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  https;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Auth (auth-service) ───────────────────────────────────────────
        location /auth/v1/ {
            set $upstream http://auth-service:3001;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  https;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 512k;
        }

        # ── Landing page (Next.js) ────────────────────────────────────────
        # Root and public sub-pages served by the Next.js landing app.

        location = / {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location /terms {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location /privacy {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location /pricing {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        # Landing static assets
        location ~* ^/(styles\.css|robots\.txt|sitemap\.xml|og-image\.(png|svg)|favicon\.svg|favicon\.ico)$ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        # Next.js landing static assets (_next)
        location /_next/ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        # ── Angular user SPA (all other paths) ───────────────────────────
        location / {
            set $upstream http://user-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }
    }

    # ── Admin app (port 8443 — HTTPS) ─────────────────────────────────────────
    server {
        listen  8443 ssl;
        listen  [::]:8443 ssl;
        server_name  _;

        # ── Admin WebSocket ───────────────────────────────────────────────
        location /ws {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $safe_upgrade;
            proxy_set_header    Connection         $safe_connection;
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  https;
            proxy_read_timeout  3600s;
        }

        # ── Admin REST API ────────────────────────────────────────────────
        location /api/v1/ {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  https;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Admin Auth ────────────────────────────────────────────────────
        location /auth/v1/ {
            set $upstream http://admin-auth-service:3003;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  https;
            proxy_read_timeout  30s;
            client_max_body_size 512k;
        }

        # ── Angular admin SPA ─────────────────────────────────────────────
        location / {
            set $upstream http://admin-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }
    }
}
