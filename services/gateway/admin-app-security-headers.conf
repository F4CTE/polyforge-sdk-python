# Admin app security headers — include in any admin-app location that defines
# its own add_header directives. Nginx does not merge parent add_header values
# into child locations after a location declares any add_header.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options           "DENY"                           always;
add_header X-Content-Type-Options    "nosniff"                        always;
add_header X-XSS-Protection          "1; mode=block"                  always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://admin.polyforge.app; frame-ancestors 'none';"
    always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
