# PROD: Used by docker-compose.prod.yml for production deployment
# ─── Polyforge Production Nginx Configuration ─────────────────────────────────
#
# Handles:
#   - HTTP → HTTPS redirect (port 80)
#   - polyforge.app: user app (React) + api-service + auth-service + WS
#   - admin.polyforge.app: admin app + admin-api + admin-auth [IP allowlist]
#   - TLS 1.2/1.3, strong ciphers, HSTS, security headers
#   - WebSocket upgrade (Upgrade + Connection headers)
#   - Gzip compression for text assets

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {

    # ── Mime types ─────────────────────────────────────────────────────────────

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens  off;

    # ── Gzip ───────────────────────────────────────────────────────────────────

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # ── TLS common settings ────────────────────────────────────────────────────

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout          5s;

    # ── Upstream definitions ───────────────────────────────────────────────────

    upstream api_service {
        server api-service:3002;
        keepalive 32;
    }

    upstream auth_service {
        server auth-service:3001;
        keepalive 16;
    }

    upstream admin_api_service {
        server admin-api-service:3004;
        keepalive 8;
    }

    upstream admin_auth_service {
        server admin-auth-service:3003;
        keepalive 8;
    }

    # ── GeoIP country blocking ──────────────────────────────────────────────────
    # Requires nginx geoip2 module and GeoLite2-Country.mmdb
    # Install: apt-get install libnginx-mod-http-geoip2
    # Download DB: https://dev.maxmind.com/geoip/geolite2-free-geolocation-data

    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        auto_reload 60m;
        $geoip2_data_country_code country iso_code;
    }

    geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
        auto_reload 60m;
        $geoip2_data_region_code subdivisions 0 iso_code;
    }

    map $geoip2_data_country_code $geo_blocked {
        default 0;
        US 1;  AU 1;  BE 1;  BY 1;  BI 1;  CF 1;  CG 1;  CU 1;
        DE 1;  ET 1;  FR 1;  GB 1;  IR 1;  IQ 1;  IT 1;  KP 1;
        LB 1;  LY 1;  MM 1;  NI 1;  NL 1;  RU 1;  SO 1;  SS 1;
        SD 1;  SY 1;  VE 1;  YE 1;  ZW 1;  UM 1;
    }

    # Close-only countries — can view but cannot open new positions
    map $geoip2_data_country_code $geo_close_only {
        default 0;
        PL 1;  SG 1;  TH 1;  TW 1;
    }

    # ── WebSocket upgrade map ──────────────────────────────────────────────────

    # Only allow WebSocket upgrades — prevents H2C smuggling (closes #298, #385)
    map $http_upgrade $safe_upgrade {
        default "";
        websocket websocket;
    }
    map $http_upgrade $safe_connection {
        default "";
        websocket upgrade;
    }

    # ── Rate limiting ──────────────────────────────────────────────────────────
    # auth: 10 req/min per IP — covers login, register, password reset
    # api:  100 req/s per IP  — general API protection
    limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_rl:10m  rate=100r/s;
    limit_req_status 429;

    # ── Admin IP allowlist ─────────────────────────────────────────────────────
    # Generated at container startup from ADMIN_ALLOWED_IPS env var.
    # See docker-entrypoint.sh for details.
    # Format: ADMIN_ALLOWED_IPS="203.0.113.1/32,10.8.0.0/24"
    include /etc/nginx/admin_allowlist.conf;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────

    server {
        listen       80;
        listen       [::]:80;
        server_name  polyforge.app www.polyforge.app admin.polyforge.app;

        # Allow Let's Encrypt ACME challenges through HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ── polyforge.app (user app) ───────────────────────────────────────────────

    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  polyforge.app www.polyforge.app;

        ssl_certificate     /etc/letsencrypt/live/polyforge.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/polyforge.app/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/polyforge.app/chain.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                           always;
        add_header X-Content-Type-Options    "nosniff"                        always;
        add_header X-XSS-Protection          "1; mode=block"                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://polyforge.app; frame-ancestors 'none';"
            always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # ── WebSocket (api-service) ─────────────────────────────────────────

        location /ws {
            proxy_pass          http://api_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $safe_upgrade;
            proxy_set_header    Connection         $safe_connection;
            proxy_set_header    Host               $server_name;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $server_name;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── Public API routes (no geo-blocking) ───────────────────────────
        # Swagger docs, action definitions, and health endpoints are
        # publicly accessible regardless of the caller's country.

        location /api/v1/docs {
            proxy_pass          http://api_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $server_name;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $server_name;
            proxy_read_timeout  30s;
        }

        location /api/v1/actions {
            proxy_pass          http://api_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $server_name;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $server_name;
            proxy_read_timeout  30s;
        }

        # ── Bot webhook endpoints (WhatsApp, Telegram, Discord) ────────
        # Webhooks must be accessible from platform IPs — no geo-blocking.

        location /api/v1/webhooks/ {
            proxy_pass          http://api_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $server_name;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $server_name;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # ── REST API (api-service) ──────────────────────────────────────────

        location /api/v1/ {
            limit_req zone=api_rl burst=50 nodelay;

            # Geo-blocking: return 451 for restricted countries
            if ($geo_blocked) {
                return 451;
            }

            proxy_pass          http://api_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $server_name;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $server_name;
            proxy_set_header    X-Country-Code     $geoip2_data_country_code;
            proxy_set_header    X-Region-Code      $geoip2_data_region_code;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Auth (auth-service) ─────────────────────────────────────────────

        location /auth/v1/ {
            limit_req zone=auth_rl burst=5 nodelay;
            proxy_pass          http://auth_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $server_name;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $remote_addr;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $server_name;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 512k;
        }

        # ── React SPA static files ────────────────────────────────────────

        # ── Landing page (Next.js) — root and public sub-pages ─────────
        #    Terms, privacy, and pricing are served from the landing app.
        #    All other paths fall through to the React SPA below.

        location = / {
            root  /usr/share/nginx/html/landing;
            try_files /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /terms {
            root  /usr/share/nginx/html/landing;
            try_files $uri $uri.html $uri/index.html /terms.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /privacy {
            root  /usr/share/nginx/html/landing;
            try_files $uri $uri.html $uri/index.html /privacy.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /pricing {
            root  /usr/share/nginx/html/landing;
            try_files $uri $uri.html $uri/index.html /pricing.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Landing page static assets (served from landing root at their
        # canonical paths so og-image, robots, sitemap resolve correctly)
        location ~* ^/(styles\.css|robots\.txt|sitemap\.xml|og-image\.(png|svg)|favicon\.svg|favicon\.ico)$ {
            root       /usr/share/nginx/html/landing;
            expires    1d;
            add_header Cache-Control "public, max-age=86400" always;
            access_log off;
        }

        # Next.js landing static assets — content-hashed, safe to cache forever
        location /_next/ {
            root       /usr/share/nginx/html/landing;
            expires    1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }

        # ── React SPA ─────────────────────────────────────────────────
        root  /usr/share/nginx/html/user-app;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively (React/Vite uses content-hashed filenames)
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif|webp)$ {
            expires        1y;
            add_header     Cache-Control "public, immutable";
            access_log     off;
        }

        # Never cache the root HTML (React app shell)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── admin.polyforge.app (admin app) ───────────────────────────────────────

    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  admin.polyforge.app;

        ssl_certificate     /etc/letsencrypt/live/admin.polyforge.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.polyforge.app/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/admin.polyforge.app/chain.pem;

        # IP allowlist — block all by default, allow only admin IPs
        if ($admin_allowed = 0) {
            return 403;
        }

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                           always;
        add_header X-Content-Type-Options    "nosniff"                        always;
        add_header X-XSS-Protection          "1; mode=block"                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://admin.polyforge.app; frame-ancestors 'none';"
            always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # ── Admin WebSocket ─────────────────────────────────────────────────

        location /ws {
            proxy_pass          http://admin_api_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $safe_upgrade;
            proxy_set_header    Connection         $safe_connection;
            proxy_set_header    Host               $server_name;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $server_name;
            proxy_read_timeout  3600s;
        }

        # ── Admin REST API ──────────────────────────────────────────────────

        location /api/v1/ {
            limit_req zone=api_rl burst=20 nodelay;
            proxy_pass          http://admin_api_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $server_name;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $server_name;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Admin Auth ──────────────────────────────────────────────────────

        location /auth/v1/ {
            limit_req zone=auth_rl burst=5 nodelay;
            proxy_pass          http://admin_auth_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $server_name;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $remote_addr;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $server_name;
            proxy_read_timeout  30s;
            client_max_body_size 512k;
        }

        # ── Admin React SPA ───────────────────────────────────────────────

        root  /usr/share/nginx/html/admin-app;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif|webp)$ {
            expires        1y;
            add_header     Cache-Control "public, immutable";
            access_log     off;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
