# ─── Polyforge Production Nginx Configuration ─────────────────────────────────
#
# Handles:
#   - HTTP → HTTPS redirect (port 80)
#   - polyforge.app: user app (Angular) + api-service + auth-service + WS
#   - admin.polyforge.app: admin app + admin-api + admin-auth [IP allowlist]
#   - TLS 1.2/1.3, strong ciphers, HSTS, security headers
#   - WebSocket upgrade (Upgrade + Connection headers)
#   - Gzip compression for text assets

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {

    # ── Mime types ─────────────────────────────────────────────────────────────

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens  off;

    # ── Gzip ───────────────────────────────────────────────────────────────────

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # ── TLS common settings ────────────────────────────────────────────────────

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout          5s;

    # ── Upstream definitions ───────────────────────────────────────────────────

    upstream api_service {
        server api-service:3002;
        keepalive 32;
    }

    upstream auth_service {
        server auth-service:3001;
        keepalive 16;
    }

    upstream admin_api_service {
        server admin-api-service:3004;
        keepalive 8;
    }

    upstream admin_auth_service {
        server admin-auth-service:3003;
        keepalive 8;
    }

    # ── WebSocket upgrade map ──────────────────────────────────────────────────

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # ── Admin IP allowlist ─────────────────────────────────────────────────────
    # Add the actual admin IP(s) here before deploying.

    geo $admin_allowed {
        default  0;
        # 203.0.113.1/32  1;  # office static IP — replace with real IP(s)
        # 10.0.0.0/8      1;  # VPN range — replace or remove
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────

    server {
        listen       80;
        listen       [::]:80;
        server_name  polyforge.app www.polyforge.app admin.polyforge.app;

        # Allow Let's Encrypt ACME challenges through HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── polyforge.app (user app) ───────────────────────────────────────────────

    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  polyforge.app www.polyforge.app;

        ssl_certificate     /etc/letsencrypt/live/polyforge.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/polyforge.app/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/polyforge.app/chain.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                           always;
        add_header X-Content-Type-Options    "nosniff"                        always;
        add_header X-XSS-Protection          "1; mode=block"                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://polyforge.app; frame-ancestors 'none';"
            always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # ── WebSocket (api-service) ─────────────────────────────────────────

        location /ws {
            proxy_pass          http://api_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $http_upgrade;
            proxy_set_header    Connection         $connection_upgrade;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── REST API (api-service) ──────────────────────────────────────────

        location /api/v1/ {
            proxy_pass          http://api_service;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Auth (auth-service) ─────────────────────────────────────────────

        location /auth/v1/ {
            proxy_pass          http://auth_service;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 512k;
        }

        # ── Angular SPA static files ────────────────────────────────────────

        root  /usr/share/nginx/html/user-app;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively (Angular uses content-hashed filenames)
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif|webp)$ {
            expires        1y;
            add_header     Cache-Control "public, immutable";
            access_log     off;
        }

        # Never cache the root HTML (Angular app shell)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── admin.polyforge.app (admin app) ───────────────────────────────────────

    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  admin.polyforge.app;

        ssl_certificate     /etc/letsencrypt/live/admin.polyforge.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.polyforge.app/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/admin.polyforge.app/chain.pem;

        # IP allowlist — block all by default, allow only admin IPs
        if ($admin_allowed = 0) {
            return 403;
        }

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                           always;
        add_header X-Content-Type-Options    "nosniff"                        always;

        # ── Admin WebSocket ─────────────────────────────────────────────────

        location /ws {
            proxy_pass          http://admin_api_service;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $http_upgrade;
            proxy_set_header    Connection         $connection_upgrade;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
        }

        # ── Admin REST API ──────────────────────────────────────────────────

        location /api/v1/ {
            proxy_pass          http://admin_api_service;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # ── Admin Auth ──────────────────────────────────────────────────────

        location /auth/v1/ {
            proxy_pass          http://admin_auth_service;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 512k;
        }

        # ── Admin Angular SPA ───────────────────────────────────────────────

        root  /usr/share/nginx/html/admin-app;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif|webp)$ {
            expires        1y;
            add_header     Cache-Control "public, immutable";
            access_log     off;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
