# ─────────────────────────────────────────────────────────────────────────────
# DEVELOPMENT OVERRIDE — volume mounts for live code reloading
#
# Usage:
#   docker compose -f docker-compose.infra.yml -f docker-compose.override.yml up -d
#
# Or symlink / rename so Docker picks it up automatically:
#   docker compose -f docker-compose.infra.yml up -d
#   (Docker Compose auto-merges docker-compose.override.yml when present)
#
# Workflow:
#   1. Build locally:  pnpm build  (or build individual packages/services)
#   2. The running containers pick up new dist/ files immediately —
#      no `docker compose build` needed.
#
# For NestJS services the container restarts automatically via
#   node --watch dist/main.js
# which watches the dist/ tree for changes.
#
# For frontend apps, nginx serves whichever files are on disk.
# After a local build the browser just needs a refresh.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── FRONTEND APPS ─────────────────────────────────────────────────────────

  user-app:
    volumes:
      - ./apps/user-app/dist:/usr/share/nginx/html:ro
      - ./apps/user-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  admin-app:
    volumes:
      - ./apps/admin-app/dist:/usr/share/nginx/html:ro
      - ./apps/admin-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  landing:
    volumes:
      - ./apps/landing:/usr/share/nginx/html:ro
      - ./apps/landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ─── NESTJS SERVICES ──────────────────────────────────────────────────────
  # Mount local dist/ output over the image's baked-in dist/.
  # Override CMD with node --watch so the process restarts on file changes.
  # Shared package dist/ and prisma client are also mounted.

  auth-service:
    volumes:
      - ./services/auth-service/dist:/app/services/auth-service/dist:ro
      - ./packages/shared-db/dist:/app/packages/shared-db/dist:ro
      - ./packages/shared-redis/dist:/app/packages/shared-redis/dist:ro
      - ./packages/shared-auth/dist:/app/packages/shared-auth/dist:ro
      - ./packages/shared-types/dist:/app/packages/shared-types/dist:ro
      - ./packages/shared-filters/dist:/app/packages/shared-filters/dist:ro
      - ./packages/logger/dist:/app/packages/logger/dist:ro
    command: ["node", "--watch", "dist/main.js"]

  api-service:
    volumes:
      - ./services/api-service/dist:/app/services/api-service/dist:ro
      - ./packages/shared-db/dist:/app/packages/shared-db/dist:ro
      - ./packages/shared-redis/dist:/app/packages/shared-redis/dist:ro
      - ./packages/shared-auth/dist:/app/packages/shared-auth/dist:ro
      - ./packages/shared-types/dist:/app/packages/shared-types/dist:ro
      - ./packages/shared-filters/dist:/app/packages/shared-filters/dist:ro
      - ./packages/logger/dist:/app/packages/logger/dist:ro
    command: ["node", "--watch", "dist/main.js"]

  admin-auth-service:
    volumes:
      - ./services/admin-auth-service/dist:/app/services/admin-auth-service/dist:ro
      - ./packages/shared-db/dist:/app/packages/shared-db/dist:ro
      - ./packages/shared-redis/dist:/app/packages/shared-redis/dist:ro
      - ./packages/shared-auth/dist:/app/packages/shared-auth/dist:ro
      - ./packages/shared-types/dist:/app/packages/shared-types/dist:ro
      - ./packages/shared-filters/dist:/app/packages/shared-filters/dist:ro
