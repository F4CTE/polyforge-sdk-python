<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="50%" stop-color="#071225"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="big-glow">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Ambient glow spots -->
  <circle cx="350" cy="250" r="200" fill="#06b6d4" opacity="0.04" filter="url(#big-glow)"/>
  <circle cx="1150" cy="250" r="200" fill="#06b6d4" opacity="0.03" filter="url(#big-glow)"/>

  <!-- Grid lines (subtle tech aesthetic) -->
  <g stroke="#06b6d4" opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="125" x2="1500" y2="125"/>
    <line x1="0" y1="250" x2="1500" y2="250"/>
    <line x1="0" y1="375" x2="1500" y2="375"/>
    <line x1="375" y1="0" x2="375" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="1125" y1="0" x2="1125" y2="500"/>
  </g>

  <!-- Small hexagon left -->
  <path d="M180 250L220 227V273L180 296L140 273V227L180 250Z" stroke="#06b6d4" stroke-width="1" fill="none" opacity="0.12"/>

  <!-- Small hexagon right -->
  <path d="M1320 250L1360 227V273L1320 296L1280 273V227L1320 250Z" stroke="#06b6d4" stroke-width="1" fill="none" opacity="0.12"/>

  <!-- Center mark: hexagon + bolt (smaller version of logo) -->
  <g transform="translate(620, 100)">
    <path
      d="M130 20L220 72V176L130 228L40 176V72L130 20Z"
      stroke="#06b6d4"
      stroke-width="2"
      fill="none"
      opacity="0.3"
      filter="url(#glow)"
    />
    <path
      d="M137 45L107 115H127L122 170L152 105H137L137 45Z"
      fill="url(#cyan-grad)"
      filter="url(#glow)"
    />
  </g>

  <!-- Wordmark -->
  <text
    x="750" y="400"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif"
    font-weight="800"
    font-size="44"
    letter-spacing="12"
    fill="#06b6d4"
    filter="url(#glow)"
  >POLYFORGE</text>

  <!-- Tagline -->
  <text
    x="750" y="445"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif"
    font-weight="400"
    font-size="16"
    letter-spacing="4"
    fill="#94a3b8"
  >AUTOMATE YOUR PREDICTION MARKET EDGE</text>
</svg>
