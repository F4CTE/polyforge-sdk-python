version: 2

updates:
  # ── npm / pnpm workspace (root lockfile covers all workspaces) ──────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        patterns: ["*"]
        update-types: ["patch"]
      minor-updates:
        patterns: ["*"]
        update-types: ["minor"]

  # ── Docker images ────────────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: "/apps/admin-app"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/landing"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/user-app"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/admin-api-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/admin-auth-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/api-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/auth-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/backtest-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/bot-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/gateway"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/market-data-service"
    schedule:
      interval: weekly


  - package-ecosystem: docker
    directory: "/services/notification-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/order-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/paper-order-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/signer-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/strategy-engine"
    schedule:
      interval: weekly

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
