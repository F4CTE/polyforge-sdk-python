name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Upgrade build toolchain
        run: pip install --upgrade "pip>=26.0" "setuptools>=78.1.1" "wheel>=0.46.2"

      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install -e .

      - name: Type check
        run: pip install pyright && pyright src/
        continue-on-error: true

      - name: Test
        run: |
          if [ -d tests ] && ls tests/*.py 1>/dev/null 2>&1; then
            pip install pytest && pytest tests/ -v
          else
            echo "No test files found — skipping"
          fi

      - name: Security audit
        run: pip install pip-audit && pip-audit --strict
