name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint & Test
    runs-on: [self-hosted, polyforge-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -e ".[dev]" 2>$null; if ($LASTEXITCODE -ne 0) { pip install -e . }
        shell: pwsh

      - name: Type check
        run: |
          pip install pyright 2>$null
          pyright src/
        shell: pwsh
        continue-on-error: true

      - name: Test
        shell: pwsh
        run: |
          if (Test-Path tests) {
            pip install pytest 2>$null
            pytest tests/ -v
          } else {
            Write-Host "No tests directory — skipping"
          }
