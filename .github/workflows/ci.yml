name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Dummy URLs — prisma generate reads the schema only, never connects
  DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  ADMIN_DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_admin'

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Lint
        run: pnpm lint

  # ── 2. Typecheck ─────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages (required by services)
        run: pnpm turbo build --filter=./packages/*

      - name: Typecheck all workspaces
        run: pnpm typecheck

  # ── 3. Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages
        run: pnpm turbo build --filter=./packages/*

      - name: Run tests with coverage
        run: pnpm turbo test:cov
        env:
          CI: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            services/*/coverage/
          retention-days: 7

  # ── 4. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build all workspaces
        run: pnpm build

      - name: Verify dist artifacts
        run: |
          echo "Checking build artifacts..."
          test -d packages/shared-types/dist
          test -d packages/shared-db/dist
          test -d packages/shared-redis/dist
          test -d packages/shared-auth/dist
          test -d packages/logger/dist
          echo "All build artifacts present"

  # ── 5. E2E ──────────────────────────────────────────────────────────────────
  # Full-stack end-to-end tests using Playwright against Docker Compose.
  # Runs after build to catch integration issues across services.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [build]
    env:
      DIRECT_DATABASE_URL: 'postgresql://poly:devpass@localhost:5432/polyforge'
      ADMIN_DIRECT_DATABASE_URL: 'postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4

      # ── Free disk space for Docker builds ────────────────────────────────
      # GitHub runners have ~14GB free; building 18 Docker images needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build shared packages
        run: pnpm turbo build --filter=./packages/*

      # ── Start the full Docker stack ──────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Docker Compose
        run: DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker compose -f docker-compose.infra.yml up -d --build
        timeout-minutes: 45

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          until docker exec polyforge-dev-postgres-1 pg_isready -U poly -d polyforge; do sleep 2; done
          echo "Waiting for Redis..."
          until docker exec polyforge-dev-redis-1 redis-cli ping | grep -q PONG; do sleep 2; done
          echo "Waiting for auth-service..."
          timeout 60 bash -c 'until curl -sf http://localhost:3001/health; do sleep 2; done'
          echo "Waiting for api-service..."
          timeout 60 bash -c 'until curl -sf http://localhost:3002/health; do sleep 2; done'
          echo "Waiting for gateway..."
          timeout 60 bash -c 'until curl -sf http://localhost/login; do sleep 2; done'
          echo "All services healthy"

      # ── Seed test data ───────────────────────────────────────────────────
      - name: Run migrations and seed
        run: |
          npx ts-node prisma/seed.ts
          ADMIN_DIRECT_DATABASE_URL="postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin" npx ts-node prisma/seed.admin.ts

      - name: Clear invite-only flag
        run: docker exec polyforge-dev-redis-1 redis-cli DEL config:invite_only

      # ── Install Playwright browsers ──────────────────────────────────────
      - name: Install Playwright browsers
        run: pnpm --filter @polyforge/e2e exec playwright install --with-deps chromium firefox

      # ── Run E2E tests ────────────────────────────────────────────────────
      - name: Run E2E tests
        run: BASE_URL=http://localhost pnpm --filter @polyforge/e2e test
        env:
          CI: true

      # ── Artifacts on failure ─────────────────────────────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Upload service logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/docker-logs
          docker compose -f docker-compose.infra.yml logs --no-color > /tmp/docker-logs/all-services.log 2>&1

      - name: Upload Docker logs artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-logs
          path: /tmp/docker-logs/
          retention-days: 7

      # ── Cleanup ──────────────────────────────────────────────────────────
      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.infra.yml down -v
