name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Limit the default GITHUB_TOKEN to read-only. This reduces the blast radius
# if a malicious PR manages to execute code on the self-hosted runner.
permissions:
  contents: read

# All 3 self-hosted runners share one physical host (polyforge-lab, 30 GB RAM).
# Per-ref concurrency (ci-${{ github.ref }}) allowed 3+ branches to run in
# parallel, exhausting memory and crashing Docker services mid-E2E (#517).
# A single global group ensures only one pipeline occupies the runners at a time.
# cancel-in-progress: true so the newest push always wins.
concurrency:
  group: ci-polyforge
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  # Dummy URLs — prisma generate reads the schema only, never connects
  DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  ADMIN_DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_admin'

jobs:
  # ── 1. Check (lint + typecheck + test in one job) ────────────────────────
  check:
    name: Check
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages
        run: pnpm turbo build --filter=./packages/*

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        if: success() || failure()
        run: pnpm typecheck

      - name: Test
        if: success() || failure()
        run: pnpm turbo test:cov
        env:
          CI: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            services/*/coverage/
          retention-days: 7

  # ── 2. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: [self-hosted, linux]
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build all workspaces
        run: pnpm build

      - name: Verify dist artifacts
        run: |
          echo "Checking build artifacts..."
          test -d packages/shared-types/dist
          test -d packages/shared-db/dist
          test -d packages/shared-redis/dist
          test -d packages/shared-auth/dist
          test -d packages/logger/dist
          test -d packages/shared-schemas/dist
          echo "All build artifacts present"

      - name: Security audit
        if: success() || failure()
        continue-on-error: true
        run: pnpm audit --audit-level=high || echo "::warning::Dependency audit found issues"

  # ── 3. E2E ──────────────────────────────────────────────────────────────
  e2e:
    name: E2E
    runs-on: [self-hosted, linux]
    needs: [build]
    # Only one E2E job at a time across all branches — they share Docker
    # Compose ports (3001, 3002, 5432, etc.) on the self-hosted runner.
    # Without this, concurrent E2E jobs fight over the same ports and either
    # fail or produce flaky results.  Queued jobs wait instead of cancelling.
    concurrency:
      group: e2e-docker-compose
      cancel-in-progress: false
    env:
      DIRECT_DATABASE_URL: 'postgresql://poly:devpass@localhost:5432/polyforge'
      ADMIN_DIRECT_DATABASE_URL: 'postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin'
      NODE_ENV: development
      # Secrets stored in GitHub Actions Encrypted Secrets — never hardcode keys (CWE-321)
      INTERNAL_JWT_SECRET: ${{ secrets.CI_INTERNAL_JWT_SECRET }}
      USER_JWT_SECRET: ${{ secrets.CI_USER_JWT_SECRET }}
      ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET }}
      BOT_JWT_SECRET: ${{ secrets.CI_BOT_JWT_SECRET }}
      MASTER_ENCRYPTION_KEY: ${{ secrets.CI_MASTER_ENCRYPTION_KEY }}
      TOTP_ENCRYPTION_KEY: ${{ secrets.CI_TOTP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build shared packages
        run: pnpm turbo build --filter=./packages/*

      # ── Pre-flight: ensure enough resources for the Docker stack ────────
      - name: Resource pre-flight check
        run: |
          echo "=== Memory ==="
          free -m
          AVAIL_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          echo "Available: ${AVAIL_MB}MB"
          if [ "$AVAIL_MB" -lt 8000 ]; then
            echo "::warning::Low memory (${AVAIL_MB}MB available). Cleaning up to free resources."
            # Kill leftover dev containers that shouldn't be running during CI
            docker ps -q --filter "name=polyforge-dev" | xargs -r docker stop 2>/dev/null || true
            docker ps -aq --filter "name=polyforge-dev" | xargs -r docker rm -f 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            echo "Rechecking..."
            free -m
          fi
          echo "=== Disk ==="
          df -h / | tail -1
          echo "=== Docker ==="
          docker system df

      # ── Start the full Docker stack ──────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true   # authenticated pulls preferred but not required

      # Set up Docker Buildx with network=host so buildkitd (which runs inside a
      # Docker container) can reach services bound to the host's loopback interface.
      # Without this, --cache-from/cache-to type=registry calls from buildkitd
      # resolve "localhost" to the buildkitd container's own loopback (not the host),
      # and the registry on localhost:5002 is unreachable → "connection refused".
      # registry-mirrors in daemon.json is unaffected — those pulls go through the
      # Docker daemon on the host, not through buildkitd's direct HTTP stack.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      # Ensure the dedicated BuildKit layer-cache registry is running on port 5002.
      # We start it here (not just in runner-setup.yml) so CI is self-healing:
      # the container might be absent on a freshly provisioned runner, or might
      # have been removed by docker system prune.  `--restart always` means it
      # survives future reboots and will already be up for the next CI run.
      #
      # Why a separate registry on 5002 (not the pull-through proxy on 5001)?
      #   A Docker Hub proxy registry (REGISTRY_PROXY_REMOTEURL set) rejects pushes
      #   with 405 Method Not Allowed.  The build-cache registry must accept pushes.
      - name: Ensure build-cache registry is running (port 5002)
        run: |
          if ! curl -sf http://localhost:5002/v2/ > /dev/null 2>&1; then
            echo "Build-cache registry not responding — starting it..."
            docker rm -f polyforge-buildcache-registry 2>/dev/null || true
            sudo mkdir -p /opt/polyforge-buildcache-registry
            sudo chown "$USER:$USER" /opt/polyforge-buildcache-registry
            docker run -d \
              --name polyforge-buildcache-registry \
              --restart always \
              -p 127.0.0.1:5002:5000 \
              -v /opt/polyforge-buildcache-registry:/var/lib/registry \
              -e REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry \
              registry:2
            # Wait for the registry to be ready (usually < 2s)
            timeout 30 bash -c 'until curl -sf http://localhost:5002/v2/; do sleep 1; done'
            echo "Build-cache registry started."
          else
            echo "Build-cache registry already running."
          fi

      # Build all services using buildx bake with a registry-type layer cache.
      #
      # Why registry-type (not local-type)?
      #   local-type stores layers as files and uses filesystem renames for atomic
      #   commits (ingest/<hash>/data → blobs/sha256/<hash>).  buildkitd is a
      #   long-running daemon that persists across CI runs; when the concurrency
      #   group cancels a job mid-build, buildkitd still has in-flight gRPC writes
      #   that reach the filesystem AFTER the next job's rm -rf ingest/ has run →
      #   "rename …startedat.tmp …startedat: no such file or directory".
      #
      #   registry-type uses OCI HTTP push/pull instead of local renames.  The
      #   registry server (localhost:5002) serialises concurrent access internally,
      #   so there is no shared mutable directory for buildkitd to race against.
      - name: Build images (with registry layer cache)
        run: |
          DOCKER_BUILDKIT=1 docker buildx bake \
            -f docker-compose.infra.yml \
            --set "*.cache-from=type=registry,ref=localhost:5002/cache/polyforge-build,ignore-error=true" \
            --set "*.cache-to=type=registry,ref=localhost:5002/cache/polyforge-build,mode=max" \
            --load
        timeout-minutes: 45

      # Remove stale containers from prior cancelled/failed runs.
      # The `if: always()` cleanup at the end of this job does not execute
      # when the job is cancelled by a concurrency group or workflow-level
      # cancel-in-progress, leaving containers behind that block the next run.
      - name: Clean up stale containers
        run: |
          docker ps -a --filter "name=polyforge-dev" -q | xargs -r docker rm -f 2>/dev/null || true
          docker network rm polyforge-dev_internal polyforge-dev_admin-only 2>/dev/null || true
          docker volume rm polyforge-dev_postgres-data polyforge-dev_postgres-admin-data polyforge-dev_redis-data 2>/dev/null || true

      - name: Start Docker Compose
        run: docker compose -f docker-compose.infra.yml up -d --force-recreate

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          until docker exec polyforge-dev-postgres-1 pg_isready -U poly -d polyforge; do sleep 2; done
          echo "Waiting for Redis..."
          until docker exec polyforge-dev-redis-1 redis-cli -a devredispass ping 2>/dev/null | grep -q PONG; do sleep 2; done
          echo "Waiting for auth-service..."
          timeout 60 bash -c 'until curl -sf http://localhost:3001/health; do sleep 2; done'
          echo "Waiting for api-service..."
          timeout 60 bash -c 'until curl -sf http://localhost:3002/health; do sleep 2; done'
          echo "Waiting for gateway..."
          timeout 60 bash -c 'until curl -sf http://localhost/login; do sleep 2; done'
          echo "All services healthy"

      # ── Seed test data ───────────────────────────────────────────────────
      - name: Run migrations and seed
        run: |
          npx ts-node prisma/seed.ts
          ADMIN_DIRECT_DATABASE_URL="postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin" npx ts-node prisma/seed.admin.ts

      - name: Clear invite-only flag
        run: docker exec polyforge-dev-redis-1 redis-cli -a devredispass SET config:invite_only false

      # ── Install Playwright browsers ──────────────────────────────────────
      - name: Install Playwright browsers
        run: pnpm --filter @polyforge/e2e exec playwright install --with-deps chromium firefox

      # ── Run E2E tests ────────────────────────────────────────────────────
      - name: Run E2E tests
        run: BASE_URL=http://localhost pnpm --filter @polyforge/e2e test
        env:
          CI: true

      # ── Artifacts on failure ─────────────────────────────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Upload service logs on failure
        if: failure()
        run: |
          mkdir -p docker-logs
          docker compose -f docker-compose.infra.yml logs --no-color > docker-logs/all-services.log 2>&1

      - name: Upload Docker logs artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-logs
          path: docker-logs/
          retention-days: 7

      # ── Cleanup ──────────────────────────────────────────────────────────
      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose -f docker-compose.infra.yml down -v --rmi local --timeout 30
          # Remove any orphaned containers from cancelled runs
          docker ps -aq --filter "name=polyforge-dev" | xargs -r docker rm -f 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          docker image prune -f --filter "until=2h"
          docker builder prune -f --keep-storage 10GB

      - name: Garbage-collect build-cache registry
        if: always()
        run: |
          # The registry on port 5002 grows unbounded (observed 189GB).
          # Run GC inside the registry container to reclaim unreferenced blobs.
          if docker ps -q --filter "name=polyforge-buildcache-registry" | grep -q .; then
            docker exec polyforge-buildcache-registry \
              bin/registry garbage-collect /etc/docker/registry/config.yml --delete-untagged 2>&1 || true
            echo "Build-cache registry size after GC:"
            du -sh /opt/polyforge-buildcache-registry 2>/dev/null || true
          fi

  # ── 4. Deploy to AWS ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all service images
        env:
          ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=(
            auth-service api-service admin-auth-service admin-api-service
            market-data-service strategy-engine order-service paper-order-service
            backtest-service notification-service bot-service signer-service
          )
          for service in "${SERVICES[@]}"; do
            echo "Building $service..."
            docker build \
              -t $ECR_BASE/polyforge/$service:$IMAGE_TAG \
              -t $ECR_BASE/polyforge/$service:latest \
              -f services/$service/Dockerfile .
            docker push $ECR_BASE/polyforge/$service:$IMAGE_TAG
            docker push $ECR_BASE/polyforge/$service:latest
          done

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v $(pwd)/prisma:/app/prisma -w /app node:24-slim \
            sh -c "npm install prisma && npx prisma migrate deploy --schema prisma/schema.prisma"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/polyforge
            git pull origin main

            bash scripts/fetch-secrets.sh

            export ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            export IMAGE_TAG=${{ github.sha }}
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            sleep 20
            curl -f https://polyforge.app/api/v1/health || exit 1

            docker logs polyforge-prod-signer-service-1 2>&1 | grep -q "Rust NAPI-RS encryption active" || \
              echo "WARNING: Rust NAPI not confirmed in signer-service logs"

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -sf https://polyforge.app/api/v1/health | jq .
          curl -sf https://admin.polyforge.app/auth/v1/health | jq . || true
