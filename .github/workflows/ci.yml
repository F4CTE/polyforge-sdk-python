name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint & Test
    runs-on: [self-hosted, polyforge-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --user -e ".[dev]" || python3 -m pip install --user -e .

      - name: Type check
        run: python3 -m pyright src/ || true

      - name: Test
        shell: node {0}
        run: |
          const fs = require('fs');
          if (fs.existsSync('tests') && fs.readdirSync('tests').some(f => f.endsWith('.py'))) {
            require('child_process').execSync('python3 -m pytest tests/ -v', { stdio: 'inherit' });
          } else {
            console.log('No test files found — skipping');
          }
