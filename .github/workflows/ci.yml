name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  # Dummy URLs — prisma generate reads the schema only, never connects
  DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  ADMIN_DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_admin'

jobs:
  # ── 1. Check (lint + typecheck + test in one job) ────────────────────────
  # On a single self-hosted runner, 3 parallel jobs = 3× setup overhead.
  # Merging them into one job saves ~4 min of repeated pnpm install + prisma
  # generate + package builds. Lint/typecheck/test still fail independently.
  check:
    name: Check
    runs-on: [self-hosted, polyforge]
    env:
      # Each runner gets its own pnpm store based on workspace dir to prevent
      # concurrent corruption when 4 runners share the SYSTEM profile.
      PNPM_STORE_DIR: .pnpm-store
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Rust/WASM packages have pre-built artifacts checked in.
      # Build scripts skip gracefully when cargo/wasm-pack aren't available.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PWD/.pnpm-store" --store-dir "$PWD/.pnpm-store"

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages
        run: pnpm turbo build --filter=./packages/*

      # Run all three checks — each step fails independently so you see
      # exactly which check broke, but we only pay the setup cost once.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        if: success() || failure()
        run: pnpm typecheck

      - name: Test
        if: success() || failure()
        run: pnpm turbo test:cov
        env:
          CI: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            services/*/coverage/
          retention-days: 7

  # ── 2. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: [self-hosted, polyforge]
    needs: [check]
    env:
      PNPM_STORE_DIR: .pnpm-store
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PWD/.pnpm-store"

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build all workspaces
        run: pnpm build

      - name: Verify dist artifacts
        shell: node {0}
        run: |
          const fs = require('fs');
          const dirs = [
            'packages/shared-types/dist',
            'packages/shared-db/dist',
            'packages/shared-redis/dist',
            'packages/shared-auth/dist',
            'packages/logger/dist',
            'packages/shared-schemas/dist',
          ];
          const missing = dirs.filter(d => !fs.existsSync(d));
          if (missing.length) {
            console.error('Missing build artifacts:', missing.join(', '));
            process.exit(1);
          }
          console.log('All build artifacts present');

      - name: Security audit
        if: success() || failure()
        continue-on-error: true
        run: pnpm audit --audit-level=high || echo "::warning::Dependency audit found issues"

  # ── 3. E2E ──────────────────────────────────────────────────────────────
  # Full-stack end-to-end tests using Playwright against Docker Compose.
  # Runs after build to catch integration issues across services.
  e2e:
    name: E2E
    runs-on: [self-hosted, polyforge]
    needs: [build]
    env:
      PNPM_STORE_DIR: .pnpm-store
      DIRECT_DATABASE_URL: 'postgresql://poly:devpass@localhost:5432/polyforge'
      ADMIN_DIRECT_DATABASE_URL: 'postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PWD/.pnpm-store"

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build shared packages
        run: pnpm turbo build --filter=./packages/*

      # ── Start the full Docker stack ──────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Docker Compose
        run: docker compose -f docker-compose.infra.yml up -d --build
        env:
          DOCKER_BUILDKIT: '1'
          COMPOSE_DOCKER_CLI_BUILD: '1'
        timeout-minutes: 45

      - name: Wait for services to be healthy
        shell: node {0}
        run: |
          const { execSync } = require('child_process');
          function waitFor(name, cmd, timeout = 60000) {
            const start = Date.now();
            process.stdout.write(`Waiting for ${name}...`);
            while (Date.now() - start < timeout) {
              try { execSync(cmd, { stdio: 'pipe' }); console.log(' ready'); return; } catch {}
              execSync(process.platform === 'win32' ? 'ping -n 3 127.0.0.1 >nul' : 'sleep 2', { stdio: 'pipe' });
            }
            throw new Error(`${name} did not become healthy within ${timeout/1000}s`);
          }
          waitFor('PostgreSQL', 'docker exec polyforge-dev-postgres-1 pg_isready -U poly -d polyforge');
          waitFor('Redis', 'docker exec polyforge-dev-redis-1 redis-cli ping');
          waitFor('auth-service', 'curl -sf http://localhost:3001/health');
          waitFor('api-service', 'curl -sf http://localhost:3002/health');
          waitFor('gateway', 'curl -sf http://localhost/login');
          console.log('All services healthy');

      # ── Seed test data ───────────────────────────────────────────────────
      - name: Run migrations and seed
        run: |
          npx ts-node prisma/seed.ts
          npx ts-node prisma/seed.admin.ts
        env:
          ADMIN_DIRECT_DATABASE_URL: 'postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin'

      - name: Clear invite-only flag
        run: docker exec polyforge-dev-redis-1 redis-cli DEL config:invite_only

      # ── Install Playwright browsers ──────────────────────────────────────
      - name: Install Playwright browsers
        run: pnpm --filter @polyforge/e2e exec playwright install --with-deps chromium firefox

      # ── Run E2E tests ────────────────────────────────────────────────────
      - name: Run E2E tests
        run: pnpm --filter @polyforge/e2e test
        env:
          CI: true
          BASE_URL: http://localhost

      # ── Artifacts on failure ─────────────────────────────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Upload service logs on failure
        if: failure()
        shell: node {0}
        run: |
          const { execSync, mkdirSync } = { ...require('child_process'), ...require('fs') };
          require('fs').mkdirSync('docker-logs', { recursive: true });
          const logs = execSync('docker compose -f docker-compose.infra.yml logs --no-color', { encoding: 'utf8', maxBuffer: 50*1024*1024 });
          require('fs').writeFileSync('docker-logs/all-services.log', logs);

      - name: Upload Docker logs artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-logs
          path: docker-logs/
          retention-days: 7

      # ── Cleanup ──────────────────────────────────────────────────────────
      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.infra.yml down -v

  # ── 4. Deploy to AWS ────────────────────────────────────────────────────
  # Triggers on manual dispatch only (workflow_dispatch).
  # Builds all Docker images (including Rust NAPI/WASM stages), pushes to ECR,
  # runs migrations, and deploys to EC2 via SSH.
  #
  # NOTE: Deploy stays on ubuntu-latest (GitHub-hosted) because it needs
  # AWS credentials and SSH keys stored in GitHub Secrets. The self-hosted
  # runner handles the heavy CI jobs; deploy is lightweight and infrequent.
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NOTE: signer-service and strategy-engine Dockerfiles include Rust build
      # stages (rust:1-slim). Docker handles Rust compilation internally.
      # signer-service uses node:24-slim (Debian) runtime for glibc/NAPI compat.
      # Build time: ~5min each for Rust services, ~2min for others.
      - name: Build and push all service images
        env:
          ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=(
            auth-service api-service admin-auth-service admin-api-service
            market-data-service strategy-engine order-service paper-order-service
            backtest-service notification-service bot-service signer-service
          )
          for service in "${SERVICES[@]}"; do
            echo "Building $service..."
            docker build \
              -t $ECR_BASE/polyforge/$service:$IMAGE_TAG \
              -t $ECR_BASE/polyforge/$service:latest \
              -f services/$service/Dockerfile .
            docker push $ECR_BASE/polyforge/$service:$IMAGE_TAG
            docker push $ECR_BASE/polyforge/$service:latest
          done

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v $(pwd)/prisma:/app/prisma -w /app node:24-slim \
            sh -c "npm install prisma && npx prisma migrate deploy --schema prisma/schema.prisma"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/polyforge
            git pull origin main

            # Refresh secrets from AWS Secrets Manager
            bash scripts/fetch-secrets.sh

            # Pull and restart services
            export ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            export IMAGE_TAG=${{ github.sha }}
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            # Wait for services and verify
            sleep 20
            curl -f https://polyforge.app/api/v1/health || exit 1

            # Verify Rust modules are active
            docker logs polyforge-prod-signer-service-1 2>&1 | grep -q "Rust NAPI-RS encryption active" || \
              echo "WARNING: Rust NAPI not confirmed in signer-service logs"

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -sf https://polyforge.app/api/v1/health | jq .
          curl -sf https://admin.polyforge.app/auth/v1/health | jq . || true
