name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Limit the default GITHUB_TOKEN to read-only. This reduces the blast radius
# if a malicious PR manages to execute code on the self-hosted runner.
permissions:
  contents: read

# Per-branch concurrency: a new push to the SAME branch cancels its previous run,
# but different branches queue independently instead of killing each other.
# The heavy jobs (deploy-dev + E2E) that share Docker services use a separate
# job-level concurrency group to serialize access — see those jobs below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  # Dummy URLs — prisma generate reads the schema only, never connects
  DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  ADMIN_DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_admin'

jobs:
  # ── 1a. Lint (parallel) ─────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: pnpm lint

  # ── 1a-2. Nginx security (parallel) ──────────────────────────────────────
  nginx-security:
    name: Nginx H2C check
    runs-on: [self-hosted, linux]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Check for H2C smuggling patterns
        run: bash scripts/check-nginx-h2c.sh

  # ── 1b. Typecheck (parallel) ────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Typecheck
        run: pnpm typecheck

  # ── 1c. Test (parallel) ─────────────────────────────────────────────────
  test:
    name: Test
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test
        run: |
          node --test tests/config/*.test.mjs
          pnpm turbo test:cov
        env:
          CI: true

  # ── 2. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: [self-hosted, linux]
    needs: [lint, typecheck, test, nginx-security]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-packages: 'false'

      - name: Build all workspaces
        run: pnpm build

      - name: Verify dist artifacts
        run: |
          echo "Checking build artifacts..."
          test -d packages/shared-types/dist
          test -d packages/shared-db/dist
          test -d packages/shared-redis/dist
          test -d packages/shared-auth/dist
          test -d packages/logger/dist
          test -d packages/shared-schemas/dist
          echo "All build artifacts present"

      - name: Security audit
        if: success() || failure()
        run: pnpm audit --audit-level=high

  # ── 3. Deploy + E2E (polyforge-lab) ─────────────────────────────────
  # Single job: deploy → setup → E2E shards (sequential).
  # MUST be one job so the concurrency group holds the lock from deploy
  # through E2E completion. Previously deploy-dev, e2e-setup, and e2e
  # were 3 separate jobs in the same concurrency group, which allowed
  # interleaving: PR1 deploys → PR2 deploys (overwrites env) → PR1's
  # E2E runs against PR2's code → ECONNREFUSED. (POLA-552)
  deploy-and-e2e:
    name: Deploy to Dev
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    needs: [build]
    timeout-minutes: 150
    concurrency:
      group: deploy-polyforge-lab
      cancel-in-progress: false
    steps:
      - name: Deploy to polyforge-lab
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          HEAD_REF: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.sha }}
          USER_JWT_SECRET: ${{ secrets.USER_JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          BOT_JWT_SECRET: ${{ secrets.BOT_JWT_SECRET }}
          INTERNAL_JWT_SECRET: ${{ secrets.INTERNAL_JWT_SECRET }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_DB_PASSWORD: ${{ secrets.ADMIN_DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POLY_BUILDER_API_KEY: ${{ secrets.POLY_BUILDER_API_KEY }}
          POLY_BUILDER_SECRET: ${{ secrets.POLY_BUILDER_SECRET }}
          POLY_BUILDER_PASSPHRASE: ${{ secrets.POLY_BUILDER_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          GAS_SPONSOR_PRIVATE_KEY: ${{ secrets.GAS_SPONSOR_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.LAB_HOST }}
          username: f4cte
          key: ${{ secrets.LAB_SSH_KEY }}
          # request_pty allocates a PTY so command_timeout/job-timeout SIGHUP kills the
          # remote process tree instead of leaving zombie deploy processes on polyforge-lab.
          request_pty: true
          command_timeout: 18m
          envs: >-
            HEAD_REF,COMMIT_SHA,
            USER_JWT_SECRET,ADMIN_JWT_SECRET,BOT_JWT_SECRET,INTERNAL_JWT_SECRET,
            MASTER_ENCRYPTION_KEY,TOTP_ENCRYPTION_KEY,
            DB_PASSWORD,ADMIN_DB_PASSWORD,REDIS_PASSWORD,
            POLY_BUILDER_API_KEY,POLY_BUILDER_SECRET,POLY_BUILDER_PASSPHRASE,
            TELEGRAM_BOT_TOKEN,DISCORD_BOT_TOKEN,
            WHATSAPP_TOKEN,WHATSAPP_PHONE_ID,WHATSAPP_VERIFY_TOKEN,WHATSAPP_APP_SECRET,
            GAS_SPONSOR_PRIVATE_KEY,
            ANTHROPIC_API_KEY,OPENAI_API_KEY
          script: |
            set -euo pipefail
            cd ~/PolyForge

            echo "=== 0. Reset local state ==="
            git reset --hard HEAD
            git clean -fd

            echo "=== 1. Pull latest code ==="
            git fetch origin

            if [ -n "$HEAD_REF" ]; then
              echo "PR detected — detaching to tip of origin/$HEAD_REF"
              git fetch origin "$HEAD_REF"
              git checkout --detach "origin/$HEAD_REF"
            else
              echo "Push detected — detaching to SHA: $COMMIT_SHA"
              git checkout --detach "$COMMIT_SHA"
            fi

            echo "=== 1b. Write .env from GitHub Secrets ==="
            bash scripts/write-env-from-ci.sh

            set -a; source .env 2>/dev/null || true; set +a
            export DIRECT_DATABASE_URL="${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL must be set in .env}"
            export ADMIN_DIRECT_DATABASE_URL="${ADMIN_DIRECT_DATABASE_URL:?ADMIN_DIRECT_DATABASE_URL must be set in .env}"
            export REDIS_PASSWORD="${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"

            echo "=== 2. Install dependencies ==="
            NODE_ENV=development pnpm install --frozen-lockfile

            echo "=== 3. Generate Prisma clients ==="
            pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
            pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

            echo "=== 4. Build shared packages ==="
            pnpm turbo build --filter=./packages/*

            echo "=== 5. Incremental Docker rebuild + restart (with TLS) ==="
            docker compose -f docker-compose.infra.yml -f docker-compose.ssl.yml build
            docker compose -f docker-compose.infra.yml -f docker-compose.ssl.yml rm -f -s migrate-user migrate-admin 2>/dev/null || true
            docker compose -f docker-compose.infra.yml -f docker-compose.ssl.yml up -d

            echo "=== 6. Wait for services ==="
            timeout 120 bash -c 'until curl -sf http://localhost:3001/health; do sleep 2; done'
            echo "  auth-service: healthy"
            timeout 120 bash -c 'until curl -sf http://localhost:3002/health; do sleep 2; done'
            echo "  api-service: healthy"
            timeout 120 bash -c 'until curl -sf https://localhost/login; do sleep 2; done'
            echo "  gateway: healthy"

            echo "=== 7. Migrate + seed ==="
            npx prisma migrate deploy --schema prisma/schema.prisma --config prisma/prisma.config.ts
            npx prisma migrate deploy --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts
            npx ts-node --transpile-only -P prisma/tsconfig.seed.json prisma/seed.ts
            npx ts-node --transpile-only -P prisma/tsconfig.seed.json prisma/seed.admin.ts

            echo "=== 8. Flush throttle counters ==="
            docker exec polyforge-dev-redis-1 redis-cli -a "$REDIS_PASSWORD" --no-auth-warning SET config:invite_only false
            docker exec polyforge-dev-redis-1 redis-cli -a "$REDIS_PASSWORD" --no-auth-warning --scan --pattern "throttler:*" \
              | xargs -r docker exec -i polyforge-dev-redis-1 redis-cli -a "$REDIS_PASSWORD" --no-auth-warning DEL || true

            echo "=== Dev environment deployed and healthy ==="

      # ── E2E Setup ──────────────────────────────────────────────────────
      - name: Kill stale Playwright / Chromium processes
        run: |
          pkill -u f4cte -f 'playwright test' 2>/dev/null || true
          pkill -u f4cte -f 'chrome-headless-shell' 2>/dev/null || true
          sleep 1

      - name: Install Playwright browsers
        run: |
          cd ~/PolyForge/tests/e2e
          timeout --kill-after=10s 120 npx playwright install --with-deps chromium 2>/dev/null || true

      - name: Run E2E global setup
        timeout-minutes: 8
        run: |
          cd ~/PolyForge/tests/e2e
          BASE_URL=https://localhost AUTH_URL=http://localhost:3001 MAILHOG_URL=http://localhost:8025 \
            CI=true npx tsx global-setup.ts

      - name: Clean stale test-results
        run: rm -rf ~/PolyForge/tests/e2e/test-results/

      # ── E2E Shards (parallel within same job) ─────────────────────────
      # All 5 shards run concurrently as background processes. Keeping them
      # inside the single deploy-and-e2e job preserves the concurrency group
      # lock so no other PR can deploy while E2E is running. The self-hosted
      # runner (Ryzen 9 9950X, 32GB RAM) handles 5 Playwright workers well.
      # The script exits on the first failed shard and terminates siblings.
      - name: Run E2E shards 1-5 in parallel
        timeout-minutes: 40
        run: |
          cd ~/PolyForge/tests/e2e
          ../../scripts/e2e/run-shards.sh

  # ── 5. Deploy to AWS (Production) ──────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    needs: [deploy-and-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push all service images
        env:
          ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=(
            auth-service api-service admin-auth-service admin-api-service
            market-data-service strategy-engine order-service paper-order-service
            backtest-service notification-service bot-service signer-service
          )
          for service in "${SERVICES[@]}"; do
            echo "Building $service..."
            docker build \
              -t $ECR_BASE/polyforge/$service:$IMAGE_TAG \
              -t $ECR_BASE/polyforge/$service:latest \
              -f services/$service/Dockerfile .
            docker push $ECR_BASE/polyforge/$service:$IMAGE_TAG
            docker push $ECR_BASE/polyforge/$service:latest
          done

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v $(pwd)/prisma:/app/prisma -w /app node:24-slim \
            sh -c "npm install prisma && npx prisma migrate deploy --schema prisma/schema.prisma"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/polyforge
            git pull origin main

            bash scripts/fetch-secrets.sh

            export ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            export IMAGE_TAG=${{ github.sha }}
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            sleep 20
            curl -f https://polyforge.app/api/v1/health || exit 1

            docker logs polyforge-prod-signer-service-1 2>&1 | grep -q "Rust NAPI-RS encryption active" || \
              echo "WARNING: Rust NAPI not confirmed in signer-service logs"

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -sf https://polyforge.app/api/v1/health | jq .
          curl -sf https://admin.polyforge.app/auth/v1/health | jq . || true
