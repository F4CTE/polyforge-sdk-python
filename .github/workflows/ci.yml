name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Limit the default GITHUB_TOKEN to read-only. This reduces the blast radius
# if a malicious PR manages to execute code on the self-hosted runner.
permissions:
  contents: read

# All 3 self-hosted runners share one physical host (polyforge-lab, 30 GB RAM).
# Per-ref concurrency (ci-${{ github.ref }}) allowed 3+ branches to run in
# parallel, exhausting memory and crashing Docker services mid-E2E (#517).
# A single global group ensures only one pipeline occupies the runners at a time.
# cancel-in-progress: true so the newest push always wins.
concurrency:
  group: ci-polyforge
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  # Dummy URLs — prisma generate reads the schema only, never connects
  DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  ADMIN_DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_admin'

jobs:
  # ── 1a. Lint (parallel) ─────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages
        run: pnpm turbo build --filter=./packages/*

      - name: Lint
        run: pnpm lint

  # ── 1b. Typecheck (parallel) ────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages
        run: pnpm turbo build --filter=./packages/*

      - name: Typecheck
        run: pnpm typecheck

  # ── 1c. Test (parallel) ─────────────────────────────────────────────────
  test:
    name: Test
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages
        run: pnpm turbo build --filter=./packages/*

      - name: Test
        run: pnpm turbo test:cov
        env:
          CI: true

      # Coverage runs locally — no need to upload to GitHub (saves artifact storage)

  # ── 2. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: [self-hosted, linux]
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build all workspaces
        run: pnpm build

      - name: Verify dist artifacts
        run: |
          echo "Checking build artifacts..."
          test -d packages/shared-types/dist
          test -d packages/shared-db/dist
          test -d packages/shared-redis/dist
          test -d packages/shared-auth/dist
          test -d packages/logger/dist
          test -d packages/shared-schemas/dist
          echo "All build artifacts present"

      - name: Security audit
        if: success() || failure()
        continue-on-error: true
        run: pnpm audit --audit-level=high || echo "::warning::Dependency audit found issues"

  # ── 3. E2E — runs on polyforge-lab via SSH ─────────────────────────────
  # Instead of building Docker images on the CI runner (slow, OOM-prone),
  # we SSH to polyforge-lab which has a persistent Docker stack running.
  # Steps: git pull → incremental rebuild → migrate → run Playwright.
  # This cuts E2E from 60-90+ min to ~15-20 min.
  e2e:
    name: E2E
    runs-on: [self-hosted, linux]
    needs: [build]
    timeout-minutes: 45
    steps:
      - name: Run E2E on polyforge-lab
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LAB_HOST }}
          username: f4cte
          key: ${{ secrets.LAB_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd ~/PolyForge

            echo "=== 1. Deploy latest code ==="
            git fetch origin
            git checkout ${{ github.sha }} --force 2>/dev/null || {
              echo "SHA not found — fetching full history..."
              git fetch origin --unshallow 2>/dev/null || true
              git checkout ${{ github.sha }} --force
            }

            # Source env vars for Prisma + Docker
            set -a; source .env 2>/dev/null || true; set +a
            export DIRECT_DATABASE_URL="${DIRECT_DATABASE_URL:-postgresql://poly:devpass@localhost:5432/polyforge}"
            export ADMIN_DIRECT_DATABASE_URL="${ADMIN_DIRECT_DATABASE_URL:-postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin}"

            echo "=== 2. Install dependencies ==="
            pnpm install --frozen-lockfile

            echo "=== 3. Generate Prisma clients ==="
            pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
            pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

            echo "=== 4. Build shared packages ==="
            pnpm turbo build --filter=./packages/*

            echo "=== 5. Incremental Docker rebuild ==="
            docker compose -f docker-compose.infra.yml build
            docker compose -f docker-compose.infra.yml up -d

            echo "=== 6. Wait for services ==="
            timeout 120 bash -c 'until curl -sf http://localhost:3001/health; do sleep 2; done'
            echo "  auth-service: healthy"
            timeout 120 bash -c 'until curl -sf http://localhost:3002/health; do sleep 2; done'
            echo "  api-service: healthy"
            timeout 120 bash -c 'until curl -sf http://localhost/login; do sleep 2; done'
            echo "  gateway: healthy"

            echo "=== 7. Migrate + seed ==="
            npx ts-node prisma/seed.ts
            ADMIN_DIRECT_DATABASE_URL="postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin" \
              npx ts-node prisma/seed.admin.ts

            echo "=== 8. Flush throttle counters ==="
            docker exec polyforge-dev-redis-1 redis-cli -a devredispass SET config:invite_only false
            docker exec polyforge-dev-redis-1 redis-cli -a devredispass --scan --pattern "throttler:*" \
              | xargs -r docker exec -i polyforge-dev-redis-1 redis-cli -a devredispass DEL || true

            echo "=== 9. Install Playwright browsers ==="
            cd tests/e2e
            npx playwright install --with-deps chromium 2>/dev/null || true

            echo "=== 10. Run E2E tests ==="
            BASE_URL=http://localhost CI=true npx playwright test --project=chromium --reporter=list


  # ── 4. Deploy to AWS ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all service images
        env:
          ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=(
            auth-service api-service admin-auth-service admin-api-service
            market-data-service strategy-engine order-service paper-order-service
            backtest-service notification-service bot-service signer-service
          )
          for service in "${SERVICES[@]}"; do
            echo "Building $service..."
            docker build \
              -t $ECR_BASE/polyforge/$service:$IMAGE_TAG \
              -t $ECR_BASE/polyforge/$service:latest \
              -f services/$service/Dockerfile .
            docker push $ECR_BASE/polyforge/$service:$IMAGE_TAG
            docker push $ECR_BASE/polyforge/$service:latest
          done

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v $(pwd)/prisma:/app/prisma -w /app node:24-slim \
            sh -c "npm install prisma && npx prisma migrate deploy --schema prisma/schema.prisma"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/polyforge
            git pull origin main

            bash scripts/fetch-secrets.sh

            export ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            export IMAGE_TAG=${{ github.sha }}
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            sleep 20
            curl -f https://polyforge.app/api/v1/health || exit 1

            docker logs polyforge-prod-signer-service-1 2>&1 | grep -q "Rust NAPI-RS encryption active" || \
              echo "WARNING: Rust NAPI not confirmed in signer-service logs"

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -sf https://polyforge.app/api/v1/health | jq .
          curl -sf https://admin.polyforge.app/auth/v1/health | jq . || true
