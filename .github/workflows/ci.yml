name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Limit the default GITHUB_TOKEN to read-only. This reduces the blast radius
# if a malicious PR manages to execute code on the self-hosted runner.
permissions:
  contents: read

# All 3 self-hosted runners share one physical host (polyforge-lab, 30 GB RAM).
# Per-ref concurrency (ci-${{ github.ref }}) allowed 3+ branches to run in
# parallel, exhausting memory and crashing Docker services mid-E2E (#517).
# A single global group ensures only one pipeline occupies the runners at a time.
# cancel-in-progress: true so the newest push always wins.
concurrency:
  group: ci-polyforge
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  # Dummy URLs — prisma generate reads the schema only, never connects
  DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  ADMIN_DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_admin'

jobs:
  # ── 1a. Lint (parallel) ─────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages
        run: pnpm turbo build --filter=./packages/*

      - name: Lint
        run: pnpm lint

  # ── 1b. Typecheck (parallel) ────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages
        run: pnpm turbo build --filter=./packages/*

      - name: Typecheck
        run: pnpm typecheck

  # ── 1c. Test (parallel) ─────────────────────────────────────────────────
  test:
    name: Test
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build packages
        run: pnpm turbo build --filter=./packages/*

      - name: Test
        run: pnpm turbo test:cov
        env:
          CI: true

      # Coverage runs locally — no need to upload to GitHub (saves artifact storage)

  # ── 2. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: [self-hosted, linux]
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build all workspaces
        run: pnpm build

      - name: Verify dist artifacts
        run: |
          echo "Checking build artifacts..."
          test -d packages/shared-types/dist
          test -d packages/shared-db/dist
          test -d packages/shared-redis/dist
          test -d packages/shared-auth/dist
          test -d packages/logger/dist
          test -d packages/shared-schemas/dist
          echo "All build artifacts present"

      - name: Security audit
        if: success() || failure()
        continue-on-error: true
        run: pnpm audit --audit-level=high || echo "::warning::Dependency audit found issues"

  # ── 3. E2E ──────────────────────────────────────────────────────────────
  e2e:
    name: E2E
    runs-on: [self-hosted, linux]
    needs: [build]
    # Only one E2E job at a time across all branches — they share Docker
    # Compose ports (3001, 3002, 5432, etc.) on the self-hosted runner.
    # Without this, concurrent E2E jobs fight over the same ports and either
    # fail or produce flaky results.  Queued jobs wait instead of cancelling.
    concurrency:
      group: e2e-docker-compose
      cancel-in-progress: false
    env:
      DIRECT_DATABASE_URL: 'postgresql://poly:devpass@localhost:5432/polyforge'
      ADMIN_DIRECT_DATABASE_URL: 'postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin'
      NODE_ENV: development
      # Secrets stored in GitHub Actions Encrypted Secrets — never hardcode keys (CWE-321)
      INTERNAL_JWT_SECRET: ${{ secrets.CI_INTERNAL_JWT_SECRET }}
      USER_JWT_SECRET: ${{ secrets.CI_USER_JWT_SECRET }}
      ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET }}
      BOT_JWT_SECRET: ${{ secrets.CI_BOT_JWT_SECRET }}
      MASTER_ENCRYPTION_KEY: ${{ secrets.CI_MASTER_ENCRYPTION_KEY }}
      TOTP_ENCRYPTION_KEY: ${{ secrets.CI_TOTP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm via packageManager field)
        run: |
          mkdir -p "$HOME/.corepack/bin"
          corepack enable --install-directory "$HOME/.corepack/bin"
          echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
          pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

      - name: Build shared packages
        run: pnpm turbo build --filter=./packages/*

      # ── Pre-flight: ensure enough resources for the Docker stack ────────
      - name: Resource pre-flight check
        run: |
          echo "=== Memory ==="
          free -m
          AVAIL_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          echo "Available: ${AVAIL_MB}MB"
          if [ "$AVAIL_MB" -lt 8000 ]; then
            echo "::warning::Low memory (${AVAIL_MB}MB available). Cleaning up to free resources."
            # Kill leftover dev containers that shouldn't be running during CI
            docker ps -q --filter "name=polyforge-dev" | xargs -r docker stop 2>/dev/null || true
            docker ps -aq --filter "name=polyforge-dev" | xargs -r docker rm -f 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            echo "Rechecking..."
            free -m
          fi
          echo "=== Disk ==="
          df -h / | tail -1
          echo "=== Docker ==="
          docker system df

      # ── Start the full Docker stack ──────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true   # authenticated pulls preferred but not required

      # Plain docker compose build — uses Docker daemon's built-in BuildKit.
      # No --profile flag: services with profiles: [full] (market-data,
      # bot, paper-order, notification) are skipped — saves ~5 min build time.
      - name: Build images
        run: docker compose -f docker-compose.infra.yml build
        timeout-minutes: 45

      # Remove stale containers from prior cancelled/failed runs.
      # The `if: always()` cleanup at the end of this job does not execute
      # when the job is cancelled by a concurrency group or workflow-level
      # cancel-in-progress, leaving containers behind that block the next run.
      - name: Clean up stale containers
        run: |
          docker ps -a --filter "name=polyforge-dev" -q | xargs -r docker rm -f 2>/dev/null || true
          docker network rm polyforge-dev_internal polyforge-dev_admin-only polyforge-dev_signer-only 2>/dev/null || true
          docker volume rm polyforge-dev_postgres-data polyforge-dev_postgres-admin-data polyforge-dev_redis-data 2>/dev/null || true

      - name: Start Docker Compose
        run: |
          docker compose -f docker-compose.infra.yml up -d --force-recreate
          # Redis can occasionally exit(0) on first start due to stale network
          # state from cancelled runs. Detect and retry once.
          sleep 3
          if ! docker ps --filter "name=polyforge-dev-redis-1" --filter "status=running" -q | grep -q .; then
            echo "::warning::Redis exited after start — retrying..."
            docker compose -f docker-compose.infra.yml up -d redis
            sleep 3
          fi

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          until docker exec polyforge-dev-postgres-1 pg_isready -U poly -d polyforge; do sleep 2; done
          echo "Waiting for Redis..."
          until docker exec polyforge-dev-redis-1 redis-cli -a devredispass ping 2>/dev/null | grep -q PONG; do sleep 2; done
          echo "Waiting for auth-service..."
          timeout 180 bash -c 'until curl -sf http://localhost:3001/health; do sleep 3; done'
          echo "Waiting for api-service..."
          timeout 180 bash -c 'until curl -sf http://localhost:3002/health; do sleep 3; done'
          echo "Waiting for gateway..."
          timeout 180 bash -c 'until curl -sf http://localhost/login; do sleep 3; done'
          echo ""
          echo "=== Verifying API proxy through gateway ==="
          echo "Testing auth-service proxy (GET /auth/v1/me)..."
          AUTH_PROXY_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/auth/v1/me)
          echo "  → HTTP $AUTH_PROXY_STATUS (expected 401 = proxy works, 502 = proxy broken)"
          echo "Testing api-service proxy (GET /api/v1/markets)..."
          API_PROXY_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/markets)
          echo "  → HTTP $API_PROXY_STATUS (expected 200 or 401 = proxy works, 502 = proxy broken)"
          echo ""
          if [ "$AUTH_PROXY_STATUS" = "502" ] || [ "$API_PROXY_STATUS" = "502" ]; then
            echo "::error::Gateway proxy is returning 502 — nginx cannot reach backend services"
            echo "=== nginx error log ==="
            docker exec polyforge-dev-gateway-1 cat /var/log/nginx/error.log 2>&1 || true
            echo "=== nginx access log (last 20) ==="
            docker exec polyforge-dev-gateway-1 tail -20 /var/log/nginx/access.log 2>&1 || true
            echo "=== DNS resolution test from gateway ==="
            docker exec polyforge-dev-gateway-1 nslookup auth-service 127.0.0.11 2>&1 || true
            docker exec polyforge-dev-gateway-1 nslookup api-service 127.0.0.11 2>&1 || true
            echo "=== Direct connectivity test from gateway ==="
            docker exec polyforge-dev-gateway-1 wget -q -O- --timeout=5 http://auth-service:3001/health 2>&1 || true
            docker exec polyforge-dev-gateway-1 wget -q -O- --timeout=5 http://api-service:3002/health 2>&1 || true
            exit 1
          fi
          echo "All services healthy — gateway proxy verified"
          echo ""
          echo "=== Login smoke test ==="
          LOGIN_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3001/auth/v1/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"alice@e2e.dev.local","password":"TestPass123!"}')
          echo "  → HTTP $LOGIN_STATUS (expected 200 = login works, 500 = auth broken)"
          if [ "$LOGIN_STATUS" = "500" ]; then
            echo "::error::Login returns 500 — auth-service is broken (likely Redis connection issue)"
            echo "=== auth-service logs ==="
            docker logs polyforge-dev-auth-service-1 --tail 30 2>&1
            echo "=== Redis connectivity from auth ==="
            docker exec polyforge-dev-auth-service-1 wget -q -O- --timeout=5 http://redis:6379 2>&1 || true
            exit 1
          fi

      # ── Seed test data ───────────────────────────────────────────────────
      - name: Run migrations and seed
        run: |
          npx ts-node prisma/seed.ts
          ADMIN_DIRECT_DATABASE_URL="postgresql://poly_admin:devpass_admin@localhost:5434/polyforge_admin" npx ts-node prisma/seed.admin.ts

      - name: Clear invite-only flag and flush throttle counters
        run: |
          docker exec polyforge-dev-redis-1 redis-cli -a devredispass SET config:invite_only false
          docker exec polyforge-dev-redis-1 redis-cli -a devredispass --scan --pattern "throttler:*" | xargs -r docker exec -i polyforge-dev-redis-1 redis-cli -a devredispass DEL || true

      # ── Install Playwright browsers ──────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/package.json') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        # Only chromium — Firefox is disabled on CI in playwright.config.ts
        run: pnpm --filter @polyforge/e2e exec playwright install --with-deps chromium

      # ── Run E2E tests ────────────────────────────────────────────────────
      - name: Run E2E tests
        timeout-minutes: 90
        run: BASE_URL=http://localhost pnpm --filter @polyforge/e2e test
        env:
          CI: true

      # ── Artifacts on failure ─────────────────────────────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: tests/e2e/test-results/
          retention-days: 3

      - name: Upload service logs on failure
        if: failure()
        run: |
          mkdir -p docker-logs
          docker compose -f docker-compose.infra.yml logs --no-color > docker-logs/all-services.log 2>&1
          echo "=== Gateway nginx error log ===" >> docker-logs/all-services.log
          docker exec polyforge-dev-gateway-1 cat /var/log/nginx/error.log >> docker-logs/all-services.log 2>&1 || true
          echo "=== Gateway nginx access log (last 100) ===" >> docker-logs/all-services.log
          docker exec polyforge-dev-gateway-1 tail -100 /var/log/nginx/access.log >> docker-logs/all-services.log 2>&1 || true
          echo "=== API proxy test at failure time ===" >> docker-logs/all-services.log
          curl -v http://localhost/auth/v1/me >> docker-logs/all-services.log 2>&1 || true
          curl -v http://localhost/api/v1/markets >> docker-logs/all-services.log 2>&1 || true

      - name: Upload Docker logs artifact
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: docker-logs
          path: docker-logs/
          retention-days: 3

      # ── Cleanup ──────────────────────────────────────────────────────────
      - name: Stop Docker Compose
        if: always()
        run: |
          # Stop containers and remove volumes (clean DB state) but KEEP images
          # cached for the next run.  --rmi local was removed because it forced
          # a full 20-30 min image rebuild on every CI run.
          docker compose -f docker-compose.infra.yml down -v --timeout 30
          # Remove any orphaned containers from cancelled runs
          docker ps -aq --filter "name=polyforge-dev" | xargs -r docker rm -f 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          # Prune only dangling images older than 24h — keep recent build cache
          docker image prune -f --filter "until=24h"
          docker builder prune -f --keep-storage 10GB


  # ── 4. Deploy to AWS ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all service images
        env:
          ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=(
            auth-service api-service admin-auth-service admin-api-service
            market-data-service strategy-engine order-service paper-order-service
            backtest-service notification-service bot-service signer-service
          )
          for service in "${SERVICES[@]}"; do
            echo "Building $service..."
            docker build \
              -t $ECR_BASE/polyforge/$service:$IMAGE_TAG \
              -t $ECR_BASE/polyforge/$service:latest \
              -f services/$service/Dockerfile .
            docker push $ECR_BASE/polyforge/$service:$IMAGE_TAG
            docker push $ECR_BASE/polyforge/$service:latest
          done

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v $(pwd)/prisma:/app/prisma -w /app node:24-slim \
            sh -c "npm install prisma && npx prisma migrate deploy --schema prisma/schema.prisma"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/polyforge
            git pull origin main

            bash scripts/fetch-secrets.sh

            export ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            export IMAGE_TAG=${{ github.sha }}
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            sleep 20
            curl -f https://polyforge.app/api/v1/health || exit 1

            docker logs polyforge-prod-signer-service-1 2>&1 | grep -q "Rust NAPI-RS encryption active" || \
              echo "WARNING: Rust NAPI not confirmed in signer-service logs"

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -sf https://polyforge.app/api/v1/health | jq .
          curl -sf https://admin.polyforge.app/auth/v1/health | jq . || true
