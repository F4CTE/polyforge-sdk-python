name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint & Test
    runs-on: [self-hosted, polyforge-sdk]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install -e .

      - name: Type check
        run: |
          pip install pyright
          pyright src/ || true

      - name: Test
        shell: node {0}
        run: |
          const fs = require('fs');
          if (fs.existsSync('tests') && fs.readdirSync('tests').some(f => f.endsWith('.py'))) {
            require('child_process').execSync('pip install pytest && pytest tests/ -v', { stdio: 'inherit' });
          } else {
            console.log('No test files found — skipping');
          }
