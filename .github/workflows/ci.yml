name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Limit the default GITHUB_TOKEN to read-only. This reduces the blast radius
# if a malicious PR manages to execute code on the self-hosted runner.
# PR #1541 refresh: no-op metadata-only CI retry bump
permissions:
  contents: read

# PR-triggered workflows are distributed across 6 named slots using endsWith()
# on the last digit of the PR number (GitHub Actions does not support the %
# modulo operator).  Each slot serializes its share of PRs with queuing
# (cancel-in-progress: false) so a flood of PRs cannot overwhelm the 6
# self-hosted runners.  Digits 0-5 map to matching slots; 6-9 share overflow
# slot ci-pr-slot-overflow.
# Push and workflow_dispatch events retain per-ref grouping with cancellation so
# pushing to main cancels stale runs as before.
# The heavy jobs (deploy-dev + E2E) that share Docker services use a separate
# job-level concurrency group — see those jobs below.
concurrency:
  group: ${{ github.event_name == 'pull_request' && ( endsWith(toJSON(github.event.pull_request.number), '0') && 'ci-pr-slot-0' || endsWith(toJSON(github.event.pull_request.number), '1') && 'ci-pr-slot-1' || endsWith(toJSON(github.event.pull_request.number), '2') && 'ci-pr-slot-2' || endsWith(toJSON(github.event.pull_request.number), '3') && 'ci-pr-slot-3' || endsWith(toJSON(github.event.pull_request.number), '4') && 'ci-pr-slot-4' || endsWith(toJSON(github.event.pull_request.number), '5') && 'ci-pr-slot-5' || 'ci-pr-slot-overflow' ) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

env:
  NODE_VERSION: '26'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_CACHE_DIR: .turbo
  # Dummy URLs — prisma generate reads the schema only, never connects
  DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  ADMIN_DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_admin'

jobs:
  external-pr-guard:
    name: External PR approval required
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Block external fork PRs from self-hosted CI
        run: |
          echo "::error::External fork PRs do not run on PolyForge self-hosted runners. A maintainer must review the diff and run trusted CI from a repository branch."
          exit 1

  secret-scan:
    name: Secret scan
    # Fork gating: external-pr-guard independently blocks fork PRs, so this
    # guard is defense-in-depth to prevent untrusted fork code from executing
    # on self-hosted runners even if external-pr-guard is refactored away.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: gitleaks detect --no-git --redact --no-banner --config .gitleaks.toml --source .

  # ── 1a. Lint (parallel) ─────────────────────────────────────────────────
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: pnpm lint

  # ── 1a-2. Nginx security (parallel) ──────────────────────────────────────
  nginx-security:
    name: Nginx H2C check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check for H2C smuggling patterns
        run: bash scripts/check-nginx-h2c.sh

  # ── 1a-3. Docker Compose security (parallel) ───────────────────────────────
  docker-compose-security:
    name: Docker Compose loopback check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check for non-loopback port bindings
        run: bash scripts/check-docker-compose-loopback.sh

  # ── 1a-4. Semgrep static analysis (parallel) ────────────────────────────
  semgrep:
    name: Semgrep scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Purge stale semgrep
        run: |
          pip uninstall -y semgrep 2>/dev/null || true
          pip cache purge 2>/dev/null || true
          rm -rf "$(python3 -c 'import site; print(site.getsitepackages()[0])')/semgrep" 2>/dev/null || true

      - name: Install semgrep
        env:
          SEMGREP_SHA256: 768166fe64a2bf75e1e9f007b75350b136d5e56d87fd322b9fcffe16797c6b21
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/semgrep-wheelhouse"
          mkdir -p "$wheel_dir"

          python3 -m pip download \
            --no-cache-dir \
            --only-binary=:all: \
            --dest "$wheel_dir" \
            -r .semgrep/requirements-semgrep.txt

          semgrep_wheel=$(find "$wheel_dir" -maxdepth 1 -name 'semgrep-*.whl' -print -quit)
          [ -n "$semgrep_wheel" ] || { echo "ERROR: no semgrep wheel found in $wheel_dir" >&2; exit 1; }
          echo "${SEMGREP_SHA256}  $semgrep_wheel" | sha256sum -c -

          python3 -m pip install \
            --require-hashes \
            --no-index \
            --find-links "$wheel_dir" \
            --no-cache-dir \
            -r .semgrep/requirements-semgrep.txt

      - name: Run semgrep
        run: |
          ulimit -l unlimited
          semgrep scan --config .semgrep/ --severity ERROR --error --no-secrets-validation --exclude '.semgrep/' --jobs 1

  # ── 1b. Typecheck (parallel) ────────────────────────────────────────────
  typecheck:
    name: Typecheck
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Typecheck
        run: pnpm typecheck

  # ── 1c. Test (parallel) ─────────────────────────────────────────────────
  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test
        run: |
          node --test tests/config/*.test.mjs
          pnpm turbo test:cov
        env:
          CI: true

  # ── 2. Auth Integration Tests ───────────────────────────────────────────
  auth-integration-test:
    name: Auth Integration Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    needs: [test]
    timeout-minutes: 15
    services:
      # Dedicated PostgreSQL for auth integration tests.
      # DB name must contain 'test' for cleanAuthDb safety check.
      test-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citest
          POSTGRES_PASSWORD: citest
          POSTGRES_DB: auth_integration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp
      # Dedicated Redis for auth integration tests.
      # Must use non-default port for cleanAuthRedis safety check.
      test-redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379/tcp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build dependencies
        run: pnpm turbo build --filter=@polyforge/auth-service...

      - name: Run Auth Integration Tests
        run: |
          pnpm --filter=@polyforge/auth-service exec vitest run \
            test/auth.infra.spec.ts test/auth.integration.spec.ts
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://citest:citest@localhost:${{ job.services.test-db.ports[5432] }}/auth_integration_test
          TEST_REDIS_URL: redis://localhost:${{ job.services.test-redis.ports[6379] }}

  # ── 3. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    needs: [secret-scan, semgrep, lint, typecheck, test, auth-integration-test, nginx-security, docker-compose-security]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-packages: 'false'

      - name: Build all workspaces
        run: pnpm build

      - name: Verify dist artifacts
        run: |
          echo "Checking build artifacts..."
          test -d packages/shared-types/dist
          test -d packages/venue-ws/dist
          test -d packages/shared-db/dist
          test -d packages/shared-redis/dist
          test -d packages/shared-auth/dist
          test -d packages/shared-filters/dist
          test -d packages/logger/dist
          test -d packages/shared-schemas/dist
          echo "All build artifacts present"

      - name: Dependency audit gate
        run: pnpm audit --audit-level=high

  # ── 3. Deploy + E2E (polyforge-lab) ─────────────────────────────────
  # Single job: deploy → setup → E2E shards (sequential).
  # MUST be one job so the concurrency group holds the lock from deploy
  # through E2E completion. Previously deploy-dev, e2e-setup, and e2e
  # were 3 separate jobs in the same concurrency group, which allowed
  # interleaving: PR1 deploys → PR2 deploys (overwrites env) → PR1's
  # E2E runs against PR2's code → ECONNREFUSED. (POLA-552)
  deploy-and-e2e:
    name: Deploy to Dev
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    needs: [build]
    timeout-minutes: 150
    environment: development
    concurrency:
      group: deploy-polyforge-lab
      cancel-in-progress: false
    steps:
      - name: Deploy to polyforge-lab
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          HEAD_REF: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.sha }}
          USER_JWT_SECRET: ${{ secrets.DEV_USER_JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.DEV_ADMIN_JWT_SECRET }}
          BOT_JWT_SECRET: ${{ secrets.DEV_BOT_JWT_SECRET }}
          INTERNAL_JWT_SECRET: ${{ secrets.DEV_INTERNAL_JWT_SECRET }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.DEV_MASTER_ENCRYPTION_KEY }}
          TOTP_ENCRYPTION_KEY: ${{ secrets.DEV_TOTP_ENCRYPTION_KEY }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          ADMIN_DB_PASSWORD: ${{ secrets.DEV_ADMIN_DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.DEV_REDIS_PASSWORD }}
          POLY_BUILDER_API_KEY: ${{ secrets.DEV_POLY_BUILDER_API_KEY }}
          POLY_BUILDER_SECRET: ${{ secrets.DEV_POLY_BUILDER_SECRET }}
          POLY_BUILDER_PASSPHRASE: ${{ secrets.DEV_POLY_BUILDER_PASSPHRASE }}
          POSTHOG_SECRET_KEY: ${{ secrets.DEV_POSTHOG_SECRET_KEY }}
          POSTHOG_DB_PASSWORD: ${{ secrets.DEV_POSTHOG_DB_PASSWORD }}
        with:
          host: ${{ secrets.LAB_HOST }}
          username: f4cte
          key: ${{ secrets.LAB_SSH_KEY }}
          # request_pty allocates a PTY so command_timeout/job-timeout SIGHUP kills the
          # remote process tree instead of leaving zombie deploy processes on polyforge-lab.
          request_pty: true
          command_timeout: 18m
          envs: >-
            HEAD_REF,COMMIT_SHA,
            USER_JWT_SECRET,ADMIN_JWT_SECRET,BOT_JWT_SECRET,INTERNAL_JWT_SECRET,
            MASTER_ENCRYPTION_KEY,TOTP_ENCRYPTION_KEY,
            DB_PASSWORD,ADMIN_DB_PASSWORD,REDIS_PASSWORD,
            POLY_BUILDER_API_KEY,POLY_BUILDER_SECRET,POLY_BUILDER_PASSPHRASE,
            POSTHOG_SECRET_KEY,POSTHOG_DB_PASSWORD
          script: |
            set -euo pipefail
            cd ~/PolyForge

            echo "=== 0. Reset local state ==="
            git reset --hard HEAD
            git clean -fd -e .paperclip

            echo "=== 1. Pull latest code ==="
            git fetch origin

            if [ -n "$HEAD_REF" ]; then
              echo "PR detected — detaching to tip of origin/$HEAD_REF"
              git fetch origin "$HEAD_REF"
              git checkout --detach "origin/$HEAD_REF"
            else
              echo "Push detected — detaching to SHA: $COMMIT_SHA"
              git checkout --detach "$COMMIT_SHA"
            fi

            echo "=== 1b. Write .env from GitHub Secrets ==="
            bash scripts/write-env-from-ci.sh

            set -a; source .env 2>/dev/null || true; set +a
            export DIRECT_DATABASE_URL="${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL must be set in .env}"
            export ADMIN_DIRECT_DATABASE_URL="${ADMIN_DIRECT_DATABASE_URL:?ADMIN_DIRECT_DATABASE_URL must be set in .env}"
            export REDIS_PASSWORD="${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"

            echo "=== 2. Install dependencies ==="
            PNPM_STORE_DIR="$(mktemp -d)"
            trap 'rm -rf "$PNPM_STORE_DIR"' EXIT
            pnpm config set store-dir "$PNPM_STORE_DIR"
            NODE_ENV=development pnpm install --frozen-lockfile

            echo "=== 3. Generate Prisma clients ==="
            pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
            pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

            echo "=== 4. Build shared packages ==="
            pnpm turbo build --filter=./packages/*

            echo "=== 5. Docker rebuild + clean restart (with TLS) ==="
            COMPOSE_PARALLEL_LIMIT=1 docker compose -f docker-compose.infra.yml -f docker-compose.ssl.yml build
            docker compose -f docker-compose.infra.yml -f docker-compose.ssl.yml down --remove-orphans --timeout 30
            echo "  ensuring port 6379 is free..."
            port_free=false
            for i in $(seq 1 10); do
              if command -v ss >/dev/null 2>&1; then
                if ss -tlnp 'sport = :6379' 2>/dev/null | grep -q ':6379'; then
                  if [ "${PIPESTATUS[0]}" -ne 0 ]; then
                    echo "  ss probe failed (exit code ${PIPESTATUS[0]}) — aborting"
                    exit 1
                  fi
                  :
                else
                  if [ "${PIPESTATUS[0]}" -ne 0 ]; then
                    echo "  ss probe failed (exit code ${PIPESTATUS[0]}) — aborting"
                    exit 1
                  fi
                  echo "  port 6379 free after ${i}s"
                  port_free=true
                  break
                fi
              else
                project_cid=$(docker ps -q --filter "name=polyforge-dev-redis" 2>/dev/null)
                if [ -z "$project_cid" ]; then
                  echo "  port 6379 appears free after ${i}s (no project redis container)"
                  port_free=true
                  break
                fi
              fi
              echo "  port 6379 still in use, attempt $i/10..."
              project_cid=$(docker ps -q --filter "name=polyforge-dev-redis" 2>/dev/null)
              if [ -n "$project_cid" ]; then
                docker rm -f $project_cid 2>/dev/null || true
              fi
              sleep 1
            done
            if [ "$port_free" != "true" ]; then
              echo "  ERROR: port 6379 still in use after 10 attempts — aborting"
              exit 1
            fi
            docker compose -f docker-compose.infra.yml -f docker-compose.ssl.yml up -d

            echo "=== 6. Wait for services ==="
            timeout 120 bash -c 'until curl -sf http://localhost:3001/health; do sleep 2; done'
            echo "  auth-service: healthy"
            timeout 120 bash -c 'until curl -sf http://localhost:3002/health; do sleep 2; done'
            echo "  api-service: healthy"
            timeout 120 bash -c 'until curl -sf https://localhost/login; do sleep 2; done'
            echo "  gateway: healthy"

            echo "=== 6b. Wait for host database ports ==="
            timeout 120 bash -c 'until (: > /dev/tcp/127.0.0.1/5432) 2>/dev/null; do sleep 2; done'
            echo "  user database host port: ready"
            timeout 120 bash -c 'until (: > /dev/tcp/127.0.0.1/5434) 2>/dev/null; do sleep 2; done'
            echo "  admin database host port: ready"

            echo "=== 7. Migrate + seed ==="
            npx prisma migrate deploy --schema prisma/schema.prisma --config prisma/prisma.config.ts
            npx prisma migrate deploy --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts
            # Seed must explicitly opt in via CI_SEED_ALLOWED; hardcoded fallback
            # passwords are never used.  E2E_USER_PASSWORD is the only known
            # password permitted — tests need a stable credential for the
            # alice@e2e.dev.local fixture.
            CI_SEED_ALLOWED=true \
              E2E_USER_PASSWORD=TestPass123! \
              npx ts-node --transpile-only -P prisma/tsconfig.seed.json prisma/seed.ts
            CI_SEED_ALLOWED=true \
              npx ts-node --transpile-only -P prisma/tsconfig.seed.json prisma/seed.admin.ts

            echo "=== 8. Flush throttle counters ==="
            docker exec polyforge-dev-redis-1 redis-cli -a "$REDIS_PASSWORD" --no-auth-warning SET config:invite_only false
            docker exec polyforge-dev-redis-1 redis-cli -a "$REDIS_PASSWORD" --no-auth-warning --scan --pattern "throttler:*" \
              | xargs -r docker exec -i polyforge-dev-redis-1 redis-cli -a "$REDIS_PASSWORD" --no-auth-warning DEL || true

            echo "=== Dev environment deployed and healthy ==="

      # ── E2E Setup ──────────────────────────────────────────────────────
      - name: Kill stale Playwright / Chromium processes
        run: |
          pkill -u f4cte -f 'playwright test' 2>/dev/null || true
          pkill -u f4cte -f 'chrome-headless-shell' 2>/dev/null || true
          sleep 1

      - name: Install Playwright browsers
        run: |
          cd ~/PolyForge/tests/e2e
          timeout --kill-after=10s 120 npx playwright install --with-deps chromium 2>/dev/null || true

      - name: Run E2E global setup
        timeout-minutes: 8
        run: |
          cd ~/PolyForge/tests/e2e
          BASE_URL=https://localhost AUTH_URL=http://localhost:3001 MAILHOG_URL=http://localhost:8025 \
            CI=true npx tsx global-setup.ts

      - name: Clean stale test-results
        run: rm -rf ~/PolyForge/tests/e2e/test-results/

      # ── E2E Shards (parallel within same job) ─────────────────────────
      # All shards run concurrently as background processes. Keeping them
      # inside the single deploy-and-e2e job preserves the concurrency group
      # lock so no other PR can deploy while E2E is running. The self-hosted
      # runner (Ryzen 9 9950X, 32GB RAM) handles 5 Playwright workers well.
      # The script exits on the first failed shard and terminates siblings.
      - name: Run E2E shards in parallel
        timeout-minutes: 40
        env:
          E2E_SKIP_SLOW_A11Y: true
          E2E_TEST_FILES: 'specs/smoke.spec.ts specs/public-pages.spec.ts specs/copy-trading.spec.ts specs/whale-tracking.spec.ts specs/news.spec.ts'
          E2E_GREP: '@smoke'
        run: |
          cd ~/PolyForge/tests/e2e
          ../../scripts/e2e/run-shards.sh

      # ── E2E Mobile Shard ──────────────────────────────────────────────
      # Run @mobile-tagged tests with the mobile-chromium project at 375px
      # viewport. Uses the same self-hosted runner; mobile suites are small
      # so 2 shards and a 15-minute cap suffice.
      - name: Run E2E mobile shard
        timeout-minutes: 15
        run: |
          cd ~/PolyForge/tests/e2e
          ../../scripts/e2e/run-shards.sh
        env:
          PLAYWRIGHT_PROJECT: mobile-chromium
          PLAYWRIGHT_RUN_MOBILE: false
          E2E_SHARD_COUNT: 1
          E2E_SHARD_TIMEOUT_SECONDS: 600
          PLAYWRIGHT_GLOBAL_TIMEOUT_MS: 600000

  # ── 4a. E2E — A11y & Keyboard (focused) ───────────────────────────────
  # Runs only the Strategy Builder a11y/keyboard block after the deploy
  # gate passes.  Separated from the main shards so the deploy gate stays
  # fast while preserving automated CI coverage for these assertions.
  e2e-a11y:
    name: E2E — A11y & Keyboard
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    needs: [deploy-and-e2e]
    timeout-minutes: 30
    steps:
      - name: Kill stale Playwright / Chromium processes
        run: |
          pkill -u f4cte -f 'playwright test' 2>/dev/null || true
          pkill -u f4cte -f 'chrome-headless-shell' 2>/dev/null || true
          sleep 1

      - name: Run A11y & Keyboard E2E tests
        timeout-minutes: 25
        env:
          BASE_URL: https://localhost
          CI: 'true'
          E2E_SKIP_SLOW_A11Y: 'false'
          PLAYWRIGHT_SKIP_GLOBAL_SETUP: 'true'
        run: |
          cd ~/PolyForge/tests/e2e
          npx playwright test specs/strategy-builder-a11y-keyboard.spec.ts \
            --project=chromium \
            --grep='@a11y|@keyboard' \
            --reporter=list

  # ── 5. Deploy to AWS (Production) ──────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    needs: [deploy-and-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Build, push, and sign all service images
        env:
          ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=(
            auth-service api-service admin-auth-service admin-api-service
            market-data-service strategy-engine order-service paper-order-service
            backtest-service notification-service bot-service signer-service
          )
          for service in "${SERVICES[@]}"; do
            image="$ECR_BASE/polyforge-$service:$IMAGE_TAG"
            echo "Building $service..."
            docker build \
              -t "$image" \
              -f services/$service/Dockerfile .
            docker push "$image"
            cosign sign --yes "$image"
          done

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v $(pwd)/prisma:/app/prisma -w /app node:26-slim \
            sh -c "npm install prisma && npx prisma migrate deploy --schema prisma/schema.prisma"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/polyforge

            PREVIOUS_IMAGE_TAG="$(cat .last-successful-image-tag 2>/dev/null || true)"
            rollback() {
              status=$?
              trap - ERR
              if [ -n "$PREVIOUS_IMAGE_TAG" ]; then
                echo "Deploy failed; rolling back to image tag $PREVIOUS_IMAGE_TAG"
                export IMAGE_TAG="$PREVIOUS_IMAGE_TAG"
                docker compose -f docker-compose.prod.yml --env-file .env.prod pull
                docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
              else
                echo "::warning::Deploy failed and no previous successful image tag was recorded; manual rollback required."
              fi
              exit "$status"
            }
            trap rollback ERR

            git fetch origin main
            git checkout --detach origin/main

            bash scripts/fetch-secrets.sh

            export ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            export IMAGE_TAG=${{ github.sha }}
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            sleep 20
            curl -f https://polyforge.app/api/v1/health || exit 1
            echo "$IMAGE_TAG" > .last-successful-image-tag
            trap - ERR

            docker logs polyforge-prod-signer-service-1 2>&1 | grep -q "Rust NAPI-RS encryption active" || \
              echo "WARNING: Rust NAPI not confirmed in signer-service logs"

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -sf https://polyforge.app/api/v1/health | jq .
          curl -sf https://admin.polyforge.app/auth/v1/health | jq . || true
