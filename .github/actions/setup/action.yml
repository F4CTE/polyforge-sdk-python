name: Setup monorepo
description: Install deps, generate Prisma clients, and optionally build shared packages

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '26'
  build-packages:
    description: Whether to build shared packages after setup
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Enable corepack (pnpm via packageManager field)
      shell: bash
      run: |
        mkdir -p "$HOME/.corepack/bin"
        corepack enable --install-directory "$HOME/.corepack/bin"
        echo "$HOME/.corepack/bin" >> "$GITHUB_PATH"

    - name: Configure isolated pnpm store
      shell: bash
      run: |
        pnpm config set store-dir "$RUNNER_TEMP/pnpm-store" --location=project
        STORE="$(pnpm store path --silent)"
        mkdir -p "$STORE"
        echo "PNPM_STORE_PATH=$STORE" >> "$GITHUB_ENV"

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ inputs.node-version }}

    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile || {
          echo "::warning::pnpm install failed, clearing corrupted store and retrying..."
          rm -rf "$PNPM_STORE_PATH"/*
          pnpm install --frozen-lockfile
        }

    - name: Generate Prisma clients
      shell: bash
      run: |
        pnpm prisma generate --schema prisma/schema.prisma --config prisma/prisma.config.ts
        pnpm prisma generate --schema prisma/schema.admin.prisma --config prisma/prisma.admin.config.ts

    - name: Clean stale incremental build caches
      if: inputs.build-packages == 'true'
      shell: bash
      run: find packages -name "tsconfig.tsbuildinfo" -delete || true

    - name: Build shared packages
      if: inputs.build-packages == 'true'
      shell: bash
      run: pnpm turbo build --filter=./packages/*

    - name: Ensure pnpm cache store exists for post-cache
      shell: bash
      run: mkdir -p "$PNPM_STORE_PATH"
