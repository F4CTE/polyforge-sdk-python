# ─── Polyforge Dev Nginx Configuration (HTTPS) ───────────────────────────────
#
# Usage: docker compose -f docker-compose.infra.yml -f docker-compose.ssl.yml up -d
#
# Port 443  → user app (HTTPS)
# Port 8443 → admin app (HTTPS)
# Port 80   → redirect to 443
# Port 8080 → redirect to 8443
# ──────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile       on;
    keepalive_timeout  65;
    server_tokens  off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP — script-src hardened: no 'unsafe-inline', no 'unsafe-eval'.
    # 'wasm-unsafe-eval' kept as a narrow allowance for any future browser-side
    # WASM (the Rust strategy/crypto modules currently run server-side only).
    # 'unsafe-inline' is retained for style-src because Tailwind/Vite/shadcn
    # emit dynamic <style> tags at runtime; nonce/hash migration tracked separately.
    # https://plausible.io allowed for landing-page analytics (user-facing only;
    # the admin server overrides this with its own stricter CSP).
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/json application/javascript
                      application/xml+rss application/atom+xml
                      image/svg+xml application/wasm;

    # ── Proxy buffers ──────────────────────────────────────────────────────
    proxy_buffer_size        16k;
    proxy_buffers            8 32k;
    proxy_busy_buffers_size  64k;

    # ── Micro-cache for public read endpoints ──────────────────────────────
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60s;

    # Only allow WebSocket upgrades — prevents H2C smuggling (closes #298, #385)
    map $http_upgrade $safe_upgrade {
        default "";
        websocket websocket;
    }
    map $http_upgrade $safe_connection {
        default "";
        websocket upgrade;
    }

    # Map the request Host header to a safe redirect target.
    # Preserves localhost, 127.0.0.1, and the configured lab hostname
    # so that Playwright/E2E tests, loopback clients, and LAN access
    # are not rewritten to a different authority.
    # Unknown hosts fall back to localhost (mitigates open‑redirect via Host‑header injection).
    map $host $redirect_host {
        default             localhost;
        localhost           $host;
        "~^127\.0\.0\.1$"   $host;
        polyforge-lab       $host;
    }

    # ── HTTP → HTTPS redirects ─────────────────────────────────────────────────

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$redirect_host$request_uri;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        return 301 https://$redirect_host:8443$request_uri;
    }

    # ── User app (HTTPS on 443) ────────────────────────────────────────────────

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # WebSocket
        location /ws {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $safe_upgrade;
            proxy_set_header    Connection         $safe_connection;
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── Micro-cached public read endpoints ────────────────────────────────
        location /api/v1/markets {
            set $upstream http://api-service:3002;
            proxy_cache            api_cache;
            proxy_cache_valid      200 5s;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
            proxy_cache_methods    GET HEAD;
            proxy_cache_key        "$scheme$request_method$server_name$request_uri";
            proxy_no_cache         $http_cookie;
            proxy_cache_bypass     $http_cookie;
            add_header             X-Cache-Status $upstream_cache_status;
            add_header             X-Content-Type-Options   "nosniff"                         always;
            add_header             X-Frame-Options          "DENY"                            always;
            add_header             X-XSS-Protection         "1; mode=block"                   always;
            add_header             Referrer-Policy          "strict-origin-when-cross-origin" always;
            add_header             Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header             Content-Security-Policy  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass             $upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade            "";
            proxy_set_header       Connection         "";
            proxy_set_header       Host               localhost;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
            client_max_body_size   1m;
        }

        location /api/v1/discover {
            set $upstream http://api-service:3002;
            proxy_cache            api_cache;
            proxy_cache_valid      200 5s;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
            proxy_cache_methods    GET HEAD;
            proxy_cache_key        "$scheme$request_method$server_name$request_uri";
            add_header             X-Cache-Status $upstream_cache_status;
            add_header             X-Content-Type-Options   "nosniff"                         always;
            add_header             X-Frame-Options          "DENY"                            always;
            add_header             X-XSS-Protection         "1; mode=block"                   always;
            add_header             Referrer-Policy          "strict-origin-when-cross-origin" always;
            add_header             Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header             Content-Security-Policy  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass             $upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade            "";
            proxy_set_header       Connection         "";
            proxy_set_header       Host               localhost;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
            client_max_body_size   1m;
        }

        location /api/v1/leaderboard {
            set $upstream http://api-service:3002;
            proxy_cache            api_cache;
            proxy_cache_valid      200 5s;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
            proxy_cache_methods    GET HEAD;
            proxy_cache_key        "$scheme$request_method$server_name$request_uri";
            add_header             X-Cache-Status $upstream_cache_status;
            add_header             X-Content-Type-Options   "nosniff"                         always;
            add_header             X-Frame-Options          "DENY"                            always;
            add_header             X-XSS-Protection         "1; mode=block"                   always;
            add_header             Referrer-Policy          "strict-origin-when-cross-origin" always;
            add_header             Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header             Content-Security-Policy  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass             $upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade            "";
            proxy_set_header       Connection         "";
            proxy_set_header       Host               localhost;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
            client_max_body_size   1m;
        }

        location /api/v1/news {
            set $upstream http://api-service:3002;
            proxy_cache            api_cache;
            proxy_cache_valid      200 5s;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
            proxy_cache_methods    GET HEAD;
            proxy_cache_key        "$scheme$request_method$server_name$request_uri";
            add_header             X-Cache-Status $upstream_cache_status;
            add_header             X-Content-Type-Options   "nosniff"                         always;
            add_header             X-Frame-Options          "DENY"                            always;
            add_header             X-XSS-Protection         "1; mode=block"                   always;
            add_header             Referrer-Policy          "strict-origin-when-cross-origin" always;
            add_header             Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header             Content-Security-Policy  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass             $upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade            "";
            proxy_set_header       Connection         "";
            proxy_set_header       Host               localhost;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
            client_max_body_size   1m;
        }

        # REST API — all other endpoints
        location /api/v1/ {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 1m;
        }

        # Bot webhook endpoints
        location /api/v1/webhooks/ {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # Auth
        location /auth/v1/ {
            set $upstream http://auth-service:3001;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 512k;
        }

        # Landing page (Next.js) — root and public sub-pages
        location = / {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location /terms {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location /privacy {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location /pricing {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        location ~* ^/(styles\.css|robots\.txt|sitemap\.xml|og-image\.(png|svg)|favicon\.svg|favicon\.ico)$ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        # Next.js landing static assets (_next)
        location /_next/ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
        }

        # React user SPA
        location / {
            set $upstream http://user-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }

        # Cache static assets (Vite/webpack content-hashed filenames)
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif|webp)$ {
            set $upstream http://user-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            add_header          Cache-Control      "public, max-age=31536000, immutable" always;
            add_header          X-Content-Type-Options   "nosniff"                         always;
            add_header          X-Frame-Options          "DENY"                            always;
            add_header          X-XSS-Protection         "1; mode=block"                   always;
            add_header          Referrer-Policy          "strict-origin-when-cross-origin" always;
            add_header          Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header          Content-Security-Policy  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }
    }

    # ── Admin app (HTTPS on 8443) ──────────────────────────────────────────────

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;

        # Admin server overrides all security headers to scope the
        # Plausible analytics source out (landing-only integration).
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header X-Frame-Options          "DENY"                            always;
        add_header X-XSS-Protection         "1; mode=block"                   always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Admin WebSocket
        location /ws {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $safe_upgrade;
            proxy_set_header    Connection         $safe_connection;
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
        }

        # Admin REST API
        location /api/v1/ {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 1m;
        }

        # Admin Auth
        location /auth/v1/ {
            set $upstream http://admin-auth-service:3003;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 512k;
        }

        # React admin SPA
        location / {
            set $upstream http://admin-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }

        # Cache static assets (Vite/webpack content-hashed filenames)
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif|webp)$ {
            set $upstream http://admin-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            "";
            proxy_set_header    Connection         "";
            proxy_set_header    Host               localhost;
            add_header          Cache-Control      "public, max-age=31536000, immutable" always;
            add_header          X-Content-Type-Options   "nosniff"                         always;
            add_header          X-Frame-Options          "DENY"                            always;
            add_header          X-XSS-Protection         "1; mode=block"                   always;
            add_header          Referrer-Policy          "strict-origin-when-cross-origin" always;
            add_header          Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header          Content-Security-Policy  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }
    }
}
