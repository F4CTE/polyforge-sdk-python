# ─── Polyforge Dev Nginx Configuration (HTTPS) ───────────────────────────────
#
# Usage: docker compose -f docker-compose.infra.yml -f docker-compose.ssl.yml up -d
#
# Port 443  → user app (HTTPS)
# Port 8443 → admin app (HTTPS)
# Port 80   → redirect to 443
# Port 8080 → redirect to 8443
# ──────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile       on;
    keepalive_timeout  65;
    server_tokens  off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss: https:; frame-ancestors 'none'" always;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # ── HTTP → HTTPS redirects ─────────────────────────────────────────────────

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # ── User app (HTTPS on 443) ────────────────────────────────────────────────

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # WebSocket
        location /ws {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $http_upgrade;
            proxy_set_header    Connection         $connection_upgrade;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # REST API
        location /api/v1/ {
            set $upstream http://api-service:3002;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 1m;
        }

        # Auth
        location /auth/v1/ {
            set $upstream http://auth-service:3001;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            client_max_body_size 512k;
        }

        # Landing page
        location = / {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
        }

        location ~* ^/(styles\.css|robots\.txt|sitemap\.xml|og-image\.(png|svg)|favicon\.svg|favicon\.ico)$ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
        }

        # Next.js landing static assets (_next)
        location /_next/ {
            set $upstream http://landing:3000;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
        }

        # React user SPA
        location / {
            set $upstream http://user-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }

        # Cache static assets (Vite/webpack content-hashed filenames)
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif|webp)$ {
            set $upstream http://user-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            add_header          Cache-Control      "public, max-age=31536000, immutable" always;
        }
    }

    # ── Admin app (HTTPS on 8443) ──────────────────────────────────────────────

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Admin WebSocket
        location /ws {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade            $http_upgrade;
            proxy_set_header    Connection         $connection_upgrade;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
        }

        # Admin REST API
        location /api/v1/ {
            set $upstream http://admin-api-service:3004;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 1m;
        }

        # Admin Auth
        location /auth/v1/ {
            set $upstream http://admin-auth-service:3003;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  30s;
            client_max_body_size 512k;
        }

        # React admin SPA
        location / {
            set $upstream http://admin-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        }

        # Cache static assets (Vite/webpack content-hashed filenames)
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif|webp)$ {
            set $upstream http://admin-app:80;
            proxy_pass          $upstream;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            add_header          Cache-Control      "public, max-age=31536000, immutable" always;
        }
    }
}
