<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polyforge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root">
    <!-- Loading screen -->
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#020817">
      <div style="text-align:center">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" style="animation:pulse-logo 1.5s ease-in-out infinite">
          <path d="M12 2L20.66 7V17L12 22L3.34 17V7L12 2Z" stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.4"/>
          <path d="M13 5L7.5 13H11L10 19L16.5 11H13L13 5Z" fill="#06b6d4"/>
        </svg>
        <p style="color:#64748b;font-family:Inter,system-ui;font-size:14px;margin-top:16px">Loading Polyforge...</p>
      </div>
    </div>
    <style>@keyframes pulse-logo{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.95)}}</style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
