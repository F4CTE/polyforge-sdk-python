<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polyforge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Polyforge — Algorithmic trading for prediction markets" />
  <meta property="og:image" content="/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
</head>
<body>
  <div id="root">
    <!-- Loading screen (design-token exception: hardcoded colors intentional here — CSS variables
         are not available before the Tailwind/React bundle loads, so raw hex values are required
         to avoid a flash of unstyled content; #020817 = --color-pf-base, #06b6d4 = --color-pf-cyan-500,
         #64748b = --color-pf-text-muted) -->
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#020817">
      <div style="text-align:center">
        <div style="position:relative;width:48px;height:48px;margin:0 auto">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" style="position:absolute;animation:spin-hex 4s linear infinite">
            <path d="M12 2L20.66 7V17L12 22L3.34 17V7L12 2Z" stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.4"/>
          </svg>
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" style="position:absolute;animation:pulse-bolt 1.5s ease-in-out infinite">
            <path d="M13 5L7.5 13H11L10 19L16.5 11H13L13 5Z" fill="#06b6d4"/>
          </svg>
        </div>
        <p style="color:#64748b;font-family:Inter,system-ui;font-size:14px;margin-top:16px">Loading Polyforge...</p>
      </div>
    </div>
    <style>
      @keyframes spin-hex{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes pulse-bolt{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.9)}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
