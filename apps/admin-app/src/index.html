<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Polyforge Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0f1a">
      <div style="text-align:center">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" style="animation:pulse-logo 1.5s ease-in-out infinite">
          <path d="M12 2L20.66 7V17L12 22L3.34 17V7L12 2Z" stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.4"/>
          <path d="M13 5L7.5 13H11L10 19L16.5 11H13L13 5Z" fill="#06b6d4"/>
        </svg>
        <p style="color:#6b7280;font-family:system-ui;font-size:14px;margin-top:16px;letter-spacing:0.5px">Loading Polyforge Admin...</p>
      </div>
    </div>
    <style>
      @keyframes pulse-logo { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.95); } }
    </style>
  </app-root>
</body>
</html>
