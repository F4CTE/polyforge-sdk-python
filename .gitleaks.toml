# Gitleaks configuration for PolyForge
# See: https://github.com/gitleaks/gitleaks#configuration

title = "PolyForge gitleaks config"

# Extend the default gitleaks ruleset so that built-in detection patterns
# (generic API keys, private keys, tokens, etc.) continue to run alongside
# the custom rules defined below.  Without this section, `gitleaks detect
# --config .gitleaks.toml` would run *only* the custom rules, which would
# create a broad detection regression.
[extend]
  useDefault = true

# Allowlist known historical findings that have been remediated.
# These entries suppress re-detection of keys that were hardcoded in
# historical commits but have since been rotated and replaced with
# GitHub Actions Encrypted Secrets.
#
# IMPORTANT: The keys exposed in commit bf2a782 have been rotated.
# All current environments use different, secret-managed values.

[allowlist]
  description = "Known remediated historical findings"

  # Commit bf2a782 contained hardcoded MASTER_ENCRYPTION_KEY and
  # TOTP_ENCRYPTION_KEY in .github/workflows/ci.yml (lines 143-144).
  # Fixed in subsequent commit — now uses ${{ secrets.CI_* }} refs.
  # Keys have been rotated for all environments.
  commits = ["bf2a782"]

  # Narrow false-positive suppressions for deterministic placeholders,
  # documentation literals, crypto test fixture addresses that match
  # entropy-based rules. Avoid broad file-level/path-level blind spots.
  # regexTarget = "line" means each regex must match the full line of the
  # source file as a substring.
  regexTarget = "line"
  regexes = [
    '''pf_live_(?:\.\.\.|your_key_here|abc123\.\.\.)''',
    '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
    '''0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48''',
    '''0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174''',
    '''abcdef123456ghij''',
    '''xyz123456789abcd''',
    '''BUILDER_SECRET\s*=\s*"0123456789abcdef"''',
    '''sk_live_abc123''',
    '''token=abc123def456''',
    # Terraform AWS Secrets Manager resource names (not real secret values)
    '''name\s*=\s*"polyforge/prod/secrets"''',
    '''name\s*=\s*"polyforge/prod/db"''',
  ]

  # Only auto-generated index artifacts that cannot contain hand-authored secrets.
  # Machine-generated by the GitNexus indexing tool — zero risk of human-introduced
  # credential values. All other files use regex-based or inline allowlist suppressions.
  paths = [
    '''(^|/)\.gitnexus/(lbug|meta\.json)$''',
    # Auto-generated NAPI-RS binding — function-name tokens in this file match
    # entropy-based generic rules; the file contains no hand-authored credentials.
    '''(^|/)packages/polyforge-crypto-native/index\.js$''',
  ]

# Detect Paperclip, AI-provider, and other operational credentials.
# These rules catch env var definitions and assignment patterns so that
# hardcoded secrets cannot be committed to the repo.
[[rules]]
  id = "paperclip-credentials"
  description = "Paperclip run JWT and API credentials"
  regex = '''(?i)(PAPERCLIP_[A-Z][A-Z0-9_]*)\s*[=:]\s*(['"][^'"]+['"]|[^\r\n]+)'''
  tags = ["paperclip", "credentials"]
  [[rules.allowlists]]
    description = "Allow environment variable pass-through assignments"
    regexTarget = "match"
    regexes = [
      '''(?i)(PAPERCLIP_[A-Z][A-Z0-9_]*)\s*[=:]\s*process\.env\.[A-Z_][A-Z0-9_]*[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow shell default expansion patterns (empty default only)"
    regexTarget = "match"
    regexes = [
      '''(?i)(PAPERCLIP_[A-Z][A-Z0-9_]*)\s*[=:]\s*\$\{[A-Z_][A-Z0-9_]*:-\}[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow redacted placeholder values in documentation and configs"
    regexTarget = "match"
    regexes = [
      '''(?i)(PAPERCLIP_[A-Z][A-Z0-9_]*)\s*[=:]\s*(<redacted>|REDACTED|\[REDACTED\]|\*\*\*\*?|redacted)[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow env passthrough with ?? default literal (safe known-placeholder or empty defaults only)"
    regexTarget = "match"
    regexes = [
      '''(?i)(PAPERCLIP_[A-Z][A-Z0-9_]*)\s*[=:]\s*process\.env\.[A-Z_][A-Z0-9_]*\s*\?\?\s*["'](?:(?:CHANGE_ME|REPLACE_ME|<redacted>|REDACTED|\[REDACTED\]|\*{3,4}|sk-(?:ant-)?xxx))?["'][\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow Terraform variable type keyword patterns"
    regexTarget = "match"
    regexes = [
      '''(?i)(PAPERCLIP_[A-Z][A-Z0-9_]*)\s*[=:]\s*(string|number|bool)[\s;]*(?:#.*)?$'''
    ]
  [[rules.allowlists]]
    description = "Allow known placeholder values in documented example env files"
    regexTarget = "match"
    regexes = [
      '''(?i)(PAPERCLIP_[A-Z][A-Z0-9_]*)\s*[=:]\s*(sk-(?:ant-)?xxx|CHANGE_ME|REPLACE_ME|<redacted>|REDACTED|\[REDACTED\]|\*\*\*\*?|redacted)[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow GitNexus index (tokenized code references in index artifacts)"
    paths = [
      '''(^|/)\.gitnexus/(lbug|meta\.json)$'''
    ]
[[rules]]
  id = "ai-provider-keys"
  description = "AI provider API keys (AWS Bedrock excluded — uses IAM)"
  regex = '''(?i)(DEEPSEEK_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY)\s*[=:]\s*(['"][^'"]+['"]|[^\r\n]+)'''
  tags = ["ai", "credentials"]
  [[rules.allowlists]]
    description = "Allow environment variable pass-through assignments"
    regexTarget = "match"
    regexes = [
      '''(?i)(DEEPSEEK_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY)\s*[=:]\s*process\.env\.[A-Z_][A-Z0-9_]*[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow shell default expansion patterns (empty default only)"
    regexTarget = "match"
    regexes = [
      '''(?i)(DEEPSEEK_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY)\s*[=:]\s*\$\{[A-Z_][A-Z0-9_]*:-\}[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow redacted placeholder values in documentation and configs"
    regexTarget = "match"
    regexes = [
      '''(?i)(DEEPSEEK_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY)\s*[=:]\s*(<redacted>|REDACTED|\[REDACTED\]|\*\*\*\*?|redacted)[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow Terraform variable type keyword values (e.g. OPENAI_API_KEY = string)"
    regexTarget = "match"
    regexes = [
      '''(?i)(DEEPSEEK_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY)\s*[=:]\s*(string|number|bool)[\s;]*(?:#.*)?$'''
    ]
  [[rules.allowlists]]
    description = "Allow known placeholder values in documented example env files"
    regexTarget = "match"
    regexes = [
      '''(?i)(DEEPSEEK_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY)\s*[=:]\s*(sk-(?:ant-)?xxx|CHANGE_ME|REPLACE_ME|<redacted>|REDACTED|\[REDACTED\]|\*\*\*\*?|redacted)[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow GitNexus index (tokenized code references in index artifacts)"
    paths = [
      '''(^|/)\.gitnexus/(lbug|meta\.json)$'''
    ]
[[rules]]
  id = "github-credentials"
  description = "GitHub tokens and personal access tokens"
  regex = '''(?i)(GITHUB_TOKEN|GITHUB_PAT)\s*[=:]\s*(['"][^'"]+['"]|[^\r\n]+)'''
  tags = ["github", "credentials"]
  [[rules.allowlists]]
    description = "Allow environment variable pass-through assignments"
    regexTarget = "match"
    regexes = [
      '''(?i)(GITHUB_TOKEN|GITHUB_PAT)\s*[=:]\s*process\.env\.[A-Z_][A-Z0-9_]*[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow shell default expansion patterns (empty default only)"
    regexTarget = "match"
    regexes = [
      '''(?i)(GITHUB_TOKEN|GITHUB_PAT)\s*[=:]\s*\$\{[A-Z_][A-Z0-9_]*:-\}[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow redacted placeholder values in documentation and configs"
    regexTarget = "match"
    regexes = [
      '''(?i)(GITHUB_TOKEN|GITHUB_PAT)\s*[=:]\s*(<redacted>|REDACTED|\[REDACTED\]|\*\*\*\*?|redacted)[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow Terraform variable type keyword values (e.g. GITHUB_TOKEN = string)"
    regexTarget = "match"
    regexes = [
      '''(?i)(GITHUB_TOKEN|GITHUB_PAT)\s*[=:]\s*(string|number|bool)[\s;]*(?:#.*)?$'''
    ]
  [[rules.allowlists]]
    description = "Allow known placeholder values in documented example env files"
    regexTarget = "match"
    regexes = [
      '''(?i)(GITHUB_TOKEN|GITHUB_PAT)\s*[=:]\s*(CHANGE_ME|REPLACE_ME|<redacted>|REDACTED|\[REDACTED\]|\*\*\*\*?|redacted)[\s;]*$'''
    ]
  [[rules.allowlists]]
    description = "Allow GitNexus index (tokenized code references in JSON and meta files)"
    paths = [
      '''(^|/)\.gitnexus/(lbug|meta\.json)$'''
    ]
